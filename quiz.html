<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Exam Quiz</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1b2130; --muted: #5d6677; --border: #dcdfe6;
  --accent: #2c56c9; --accent-weak: #e7edfb; --ok: #17703e; --ok-bg: #e5f3eb; --bad: #b3261e; --bad-bg: #fbeae9;
  --chip: #eef0f4; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --card: #171b22; --text: #e5e8ee; --muted: #9aa3b3; --border: #2a303b;
    --accent: #7f9dff; --accent-weak: #1c2640; --ok: #62d394; --ok-bg: #11281b; --bad: #ff8f86; --bad-bg: #2d1513;
    --chip: #222833; --on-accent: #0f1217; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --card: #171b22; --text: #e5e8ee; --muted: #9aa3b3; --border: #2a303b;
  --accent: #7f9dff; --accent-weak: #1c2640; --ok: #62d394; --ok-bg: #11281b; --bad: #ff8f86; --bad-bg: #2d1513;
  --chip: #222833; --on-accent: #0f1217; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.score { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: .88rem; white-space: nowrap; }
.pill b { font-variant-numeric: tabular-nums; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--chip); color: var(--text); border-radius: 999px; padding: 4px 10px;
  font-size: .85rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
select, button { font: inherit; }
select { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 8px; }
.btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: default; }
label.tog { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); cursor: pointer; }
.progress { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; font-size: .9rem; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tag { font-size: .75rem; border-radius: 6px; padding: 2px 8px; background: var(--chip); color: var(--muted); }
.tag.Easy { color: var(--ok); } .tag.Hard { color: var(--bad); }
.q { font-size: 1.06rem; font-weight: 600; white-space: pre-wrap; margin: 4px 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; white-space: pre-wrap; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-weak); }
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 6px; background: var(--chip); display: grid; place-items: center;
  font-weight: 700; font-size: .85rem; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.note { display: block; font-size: .86rem; color: var(--muted); margin-top: 4px; }
.fb { margin-top: 14px; border-radius: 10px; padding: 10px 12px; display: none; }
.fb.show { display: block; }
.fb.ok { background: var(--ok-bg); border: 1px solid var(--ok); }
.fb.bad { background: var(--bad-bg); border: 1px solid var(--bad); }
.fb b { display: block; margin-bottom: 4px; }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.dot { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border); background: var(--chip); font-size: .65rem;
  color: var(--muted); cursor: pointer; padding: 0; }
.dot.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.dot.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.dot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }
.kbd { font-size: .8rem; color: var(--muted); margin-top: 10px; }
@media (max-width: 560px) { .q { font-size: 1rem; } .nav .btn { flex: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Computer Vision — Exam Quiz</h1>
      <div class="sub"><span id="total"></span> MCQs from the practice sets · instant feedback with explanations</div>
    </div>
    <div class="score">
      <span class="pill">Score <b id="sc">0 / 0</b></span>
      <span class="pill">Accuracy <b id="acc">—</b></span>
      <span class="pill">Answered <b id="ans">0 / 0</b></span>
    </div>
  </header>

  <section class="panel" aria-label="Filters">
    <p class="label">Sessions</p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label class="tog">Difficulty
        <select id="diff"><option value="">All</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
      </label>
      <label class="tog">Show
        <select id="status"><option value="">All questions</option><option value="unanswered">Unanswered</option><option value="wrong">My mistakes</option></select>
      </label>
      <label class="tog"><input type="checkbox" id="shopt"> Shuffle options</label>
    </div>
    <div class="row">
      <button class="btn" id="shuffle">Shuffle questions</button>
      <button class="btn" id="order">Original order</button>
      <button class="btn" id="reset">Reset answers</button>
      <button class="btn" id="theme" title="Toggle light/dark">Theme</button>
    </div>
  </section>

  <section class="panel" id="quiz" aria-live="polite">
    <div class="progress"><span id="pos"></span><div class="bar"><i id="barfill"></i></div></div>
    <div id="card"></div>
    <div class="nav">
      <button class="btn" id="prev">← Previous</button>
      <button class="btn primary" id="next">Next →</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="kbd">Keys: 1–4 or A–D to answer · ← / → to move</div>
  </section>

  <section class="panel">
    <p class="label">Score by session (all answered questions)</p>
    <table><thead><tr><th>Session</th><th class="n">Answered</th><th class="n">Correct</th><th class="n">%</th></tr></thead>
      <tbody id="bysess"></tbody></table>
  </section>
</div>

<script>
const QUESTIONS = [{"id": "S01-Q1", "session": 1, "topic": "Filtering", "difficulty": "Easy", "question": "Which of the following filters is non-linear?", "options": ["Gaussian filter", "Box (mean) filter", "Median filter", "Sobel filter"], "answer": 2, "explanation": "The median is an order statistic: median(f + g) ≠ median(f) + median(g) in general (e.g. [0,0,5] and [5,0,0] both have median 0, but their sum [5,0,5] has median 5), so it cannot be written as a convolution.", "option_notes": ["Wrong — the Gaussian filter is a weighted sum, hence linear and shift-invariant.", "Wrong — the mean filter is a uniform weighted sum, hence linear.", "Correct — the median is a rank (order-statistic) filter and is non-linear.", "Wrong — Sobel is a fixed kernel applied by correlation, hence linear."]}, {"id": "S01-Q2", "session": 1, "topic": "Convolution vs correlation", "difficulty": "Medium", "question": "A \"convolution\" layer in a CNN (and OpenCV's cv2.filter2D) actually computes:", "options": ["True convolution — the kernel is flipped by 180° before sliding", "Cross-correlation — the kernel is slid over the image without flipping", "A median of the products under the kernel", "Convolution in the Fourier domain only, never in the spatial domain"], "answer": 1, "explanation": "Deep-learning frameworks and cv2.filter2D slide the kernel without flipping it, which is cross-correlation. Because CNN kernels are learned, the network simply learns the flipped kernel, so the distinction does not matter there.", "option_notes": ["Wrong — that is the mathematical definition of convolution, which these implementations do not follow.", "Correct — no flip, i.e. cross-correlation.", "Wrong — the median is a non-linear rank filter, unrelated to a conv layer.", "Wrong — FFT/Winograd tricks may be used for speed, but the operation computed is spatial correlation."]}, {"id": "S01-Q3", "session": 1, "topic": "Harris", "difficulty": "Medium", "question": "At a pixel the Harris structure tensor M has eigenvalues λ₁ = 500 and λ₂ = 2 (k = 0.04). The pixel is best described as:", "options": ["A corner, because R is large and positive", "A flat region, because λ₂ is small", "An edge, but with R > 0", "An edge, with R < 0"], "answer": 3, "explanation": "One large and one small eigenvalue means intensity changes in only one direction, i.e. an edge. R = λ₁λ₂ − k(λ₁+λ₂)² = 1000 − 0.04·502² = −9080.16 < 0.", "option_notes": ["Wrong — a corner needs both eigenvalues large; here R is negative.", "Wrong — flat needs both eigenvalues small; λ₁ = 500 is large.", "Wrong — for an edge the −k(tr M)² term dominates, so R is negative.", "Correct — edge, R = −9080.16."]}, {"id": "S01-Q4", "session": 1, "topic": "Harris invariance", "difficulty": "Medium", "question": "Which change to the image can make a Harris corner stop being detected (same window size and threshold) even though the physical corner is still fully visible?", "options": ["Zooming in by a factor of 4", "Rotating the image by 30°", "Adding 40 to every pixel intensity", "Translating the image by 25 pixels"], "answer": 0, "explanation": "Harris uses a fixed-size window, so it is not scale-invariant: after zooming in the corner fills the window and looks locally like an edge (R < 0 or small).", "option_notes": ["Correct — Harris is not scale-invariant.", "Wrong — rotation rotates the error ellipse but leaves the eigenvalues of M unchanged.", "Wrong — an additive offset does not change the derivatives, so M and R are unchanged.", "Wrong — Harris is computed locally everywhere, so it is translation-invariant."]}, {"id": "S01-Q5", "session": 1, "topic": "Canny", "difficulty": "Medium", "question": "Canny is run with T_low = 50 and T_high = 150. After non-maximum suppression a pixel has gradient magnitude 90. In the final edge map this pixel is:", "options": ["Always kept, because 90 > T_low", "Always discarded, because 90 < T_high", "Kept only if it is connected (8-connectivity, through other weak pixels) to a pixel with magnitude ≥ 150", "Kept only if its gradient direction is quantised to 0°"], "answer": 2, "explanation": "50 ≤ 90 < 150 makes it a weak pixel. Hysteresis keeps weak pixels only if they connect to a strong pixel (≥ 150); isolated weak pixels are discarded as noise.", "option_notes": ["Wrong — being above T_low is necessary but not sufficient.", "Wrong — that would be a single threshold at 150 and would break contours.", "Correct — hysteresis edge tracking.", "Wrong — direction only matters in non-maximum suppression, which has already happened."]}, {"id": "S01-Q6", "session": 1, "topic": "SIFT", "difficulty": "Easy", "question": "The standard SIFT descriptor has dimension:", "options": ["64 = 4×4 subregions × 4 Haar sums", "128 = 4×4 cells × 8 orientation bins", "256 = number of binary intensity tests", "36 = number of orientation-histogram bins"], "answer": 1, "explanation": "SIFT samples a 16×16 window, splits it into 4×4 cells and builds an 8-bin gradient-orientation histogram in each: 4 × 4 × 8 = 128.", "option_notes": ["Wrong — 64-d with Haar sums is the SURF descriptor.", "Correct — 4×4×8 = 128.", "Wrong — 256 binary tests is ORB (rBRIEF).", "Wrong — 36 bins is SIFT's orientation-assignment histogram, not the descriptor."]}, {"id": "S01-Q7", "session": 1, "topic": "SIFT / DoG", "difficulty": "Hard", "question": "SIFT detects keypoints as extrema of D = L(x, y, kσ) − L(x, y, σ). This is justified because D approximates:", "options": ["The first derivative of a Gaussian, the optimal step-edge detector", "The Harris response det M − k(tr M)² at scale σ", "The un-normalised Laplacian ∇²G, whose response grows at coarse scales", "The scale-normalised Laplacian of Gaussian σ²∇²G, up to the constant factor (k − 1)"], "answer": 3, "explanation": "From ∂G/∂σ = σ∇²G, a finite difference gives G(kσ) − G(σ) ≈ (k − 1)σ²∇²G. The σ² factor is exactly the scale normalisation; (k − 1) is constant so extrema locations are unchanged.", "option_notes": ["Wrong — that is Canny's edge filter; here DoG means difference, not derivative, of Gaussians.", "Wrong — Harris uses products of first derivatives, not differences of blurred images.", "Wrong — the un-normalised Laplacian response decreases with σ; DoG contains the σ² normalisation.", "Correct — DoG ≈ (k − 1)σ²∇²G."]}, {"id": "S01-Q8", "session": 1, "topic": "ORB", "difficulty": "Medium", "question": "Which statement about ORB is correct?", "options": ["Its 256-bit rBRIEF descriptor is matched with the Hamming distance", "Its keypoints are extrema of a Difference-of-Gaussians scale space", "It is patented and available only in OpenCV's non-free contrib module", "Its descriptor is 64 floating-point Haar-wavelet sums"], "answer": 0, "explanation": "ORB's rBRIEF descriptor is 256 binary intensity tests (256 bits = 32 bytes), compared with the Hamming distance (XOR + popcount).", "option_notes": ["Correct — binary descriptor, Hamming distance.", "Wrong — DoG extrema are SIFT; ORB uses FAST-9 + Harris ranking on an image pyramid.", "Wrong — ORB is free (BSD) in main OpenCV; SURF is the non-free one.", "Wrong — that describes SURF's 64-d descriptor."]}, {"id": "S02-Q1", "session": 2, "topic": "Distance metrics", "difficulty": "Easy", "question": "You match ORB descriptors with cv2.BFMatcher. Which norm should you use?", "options": ["NORM_L2", "NORM_L1", "NORM_HAMMING", "Cosine distance after converting the descriptors to float"], "answer": 2, "explanation": "ORB produces binary 256-bit descriptors (32 bytes); the natural dissimilarity is the number of differing bits, the Hamming distance (XOR + popcount).", "option_notes": ["Wrong — L2 is for float descriptors such as SIFT/SURF; on packed bytes it is meaningless.", "Wrong — L1 on the byte values is equally meaningless for bit strings.", "Correct — binary descriptors are compared with the Hamming distance.", "Wrong — converting bits to floats and using cosine wastes time and does not measure bit disagreement."]}, {"id": "S02-Q2", "session": 2, "topic": "Ratio test", "difficulty": "Medium", "question": "Lowe's ratio test rejects a putative match when:", "options": ["d₁/d₂ is close to 1, i.e. the best and second-best candidates are almost equally good", "d₁ exceeds a fixed absolute distance threshold", "The match is not mutual (cross-check fails)", "d₂ is much larger than d₁"], "answer": 0, "explanation": "The test accepts only if d₁/d₂ < τ (τ ≈ 0.7–0.8). A ratio near 1 means two candidates are almost equally similar, so the match is ambiguous and likely wrong.", "option_notes": ["Correct — a ratio near 1 signals an ambiguous match.", "Wrong — that is an absolute threshold, which the ratio test is designed to replace.", "Wrong — that is the cross-check (mutual nearest neighbour), a different filter.", "Wrong — d₂ much larger than d₁ gives a small ratio, so the match is accepted as distinctive."]}, {"id": "S02-Q3", "session": 2, "topic": "Homography", "difficulty": "Easy", "question": "A planar homography has how many degrees of freedom, and how many point correspondences are needed at minimum to estimate it?", "options": ["9 DOF, 5 correspondences", "6 DOF, 3 correspondences", "8 DOF, 3 correspondences", "8 DOF, 4 correspondences with no three collinear"], "answer": 3, "explanation": "H has 9 entries but is defined up to scale, so 8 DOF. Each correspondence gives 2 equations, so 4 correspondences are needed, with no three collinear.", "option_notes": ["Wrong — ignores the scale ambiguity (9 entries but only 8 DOF).", "Wrong — 6 DOF and 3 points describe an affine transform.", "Wrong — 3 points give only 6 equations, not enough for 8 DOF.", "Correct — 8 DOF, 4 non-degenerate correspondences."]}, {"id": "S02-Q4", "session": 2, "topic": "Homography validity", "difficulty": "Medium", "question": "In which situation are two photographs related exactly by a single homography?", "options": ["The camera translates sideways along a street with buildings at different depths", "The camera rotates about its optical centre while photographing a 3-D scene", "Any two images of a rigid, static scene", "The camera moves forward through a furnished room"], "answer": 1, "explanation": "Under pure rotation about the optical centre, H = KRK⁻¹ maps every pixel exactly, independent of scene depth — the basis of panoramas.", "option_notes": ["Wrong — translation with depth variation causes parallax; points at different depths shift differently.", "Correct — pure rotation gives H = KRK⁻¹ for any scene.", "Wrong — a general rigid scene between two views needs the fundamental or essential matrix.", "Wrong — forward motion through a 3-D room is translation with strong depth variation, i.e. parallax."]}, {"id": "S02-Q5", "session": 2, "topic": "RANSAC", "difficulty": "Medium", "question": "How many RANSAC iterations are needed to estimate a homography with probability p = 0.99 of drawing at least one outlier-free sample when half of the matches are outliers?", "options": ["17", "71", "72", "1177"], "answer": 2, "explanation": "N = ⌈log(0.01) / log(1 − 0.5⁴)⌉ = ⌈−4.605 / −0.06454⌉ = ⌈71.36⌉ = 72.", "option_notes": ["Wrong — 17 is for a 2-point model at e = 0.5, or a homography at e = 0.3.", "Wrong — rounding down; N must be rounded up to guarantee p.", "Correct — 71.36 rounded up is 72.", "Wrong — 1177 is for the 8-point fundamental matrix (s = 8)."]}, {"id": "S02-Q6", "session": 2, "topic": "FLANN", "difficulty": "Medium", "question": "Which FLANN index is appropriate for matching large sets of ORB descriptors?", "options": ["Randomised KD-trees (FLANN_INDEX_KDTREE, trees = 5)", "Brute force with NORM_L2", "Hierarchical k-means tree with L2 distance", "Locality-sensitive hashing (FLANN_INDEX_LSH)"], "answer": 3, "explanation": "LSH hashes random subsets of bits, so binary strings with a small Hamming distance collide in the same buckets, giving fast approximate nearest neighbours for ORB/BRIEF.", "option_notes": ["Wrong — KD-trees split on coordinate values of float vectors and work poorly in Hamming space.", "Wrong — brute force is not a FLANN index, and L2 is the wrong norm for binary descriptors.", "Wrong — hierarchical k-means with L2 is meant for float descriptors.", "Correct — LSH is the FLANN index for binary descriptors."]}, {"id": "S02-Q7", "session": 2, "topic": "Panorama blending", "difficulty": "Medium", "question": "What is the main purpose of multi-band (Laplacian-pyramid) blending in panorama stitching?", "options": ["To remove ghosting caused by parallax", "To blend low frequencies over a wide transition and high frequencies over a narrow one, giving seamless yet sharp results", "To estimate the homographies between images more accurately", "To correct radial lens distortion"], "answer": 1, "explanation": "Each Laplacian band is blended with a correspondingly blurred mask: coarse bands over a wide region (no visible exposure step) and fine bands over a narrow region (no blur or double edges).", "option_notes": ["Wrong — blending cannot fix geometric misalignment from parallax; that needs capture discipline, seam cutting or local warps.", "Correct — frequency-dependent transition widths.", "Wrong — homographies come from matching, RANSAC and bundle adjustment, not from blending.", "Wrong — lens distortion is corrected by calibration and undistortion before warping."]}, {"id": "S02-Q8", "session": 2, "topic": "Classical CV limits", "difficulty": "Hard", "question": "In which scenario is a classical SIFT + ratio test + RANSAC pipeline most likely to fail?", "options": ["Matching two views of a plain white, textureless wall", "Stitching two photos of a textured mountain range taken by rotating the camera", "Recognising the same book cover rotated by 45° and scaled by 2×", "Tracking a textured planar poster under a moderate lighting change"], "answer": 0, "explanation": "A textureless wall has almost no corners or blobs, so SIFT finds few keypoints with bland, ambiguous descriptors, leaving too few correct matches for RANSAC.", "option_notes": ["Correct — textureless surfaces are the classic failure case.", "Wrong — a textured scene under pure rotation is the ideal case (homography, many features).", "Wrong — SIFT is rotation- and scale-invariant, so this is handled well.", "Wrong — a textured plane under moderate lighting change is a classic success case."]}, {"id": "S03-Q1", "session": 3, "topic": "Equivariance vs invariance", "difficulty": "Easy", "question": "A stride-1 convolution layer (ignore border effects) is applied to an image, giving feature map F₁. The image is shifted 5 pixels to the right and the same layer is applied again, giving F₂. Which statement is correct?", "options": ["F₂ = F₁, because convolution is translation invariant.", "F₂ equals F₁ shifted 5 pixels to the right, because convolution is translation equivariant.", "F₂ equals F₁ shifted 5 pixels to the left, because the kernel is flipped.", "F₂ is unrelated to F₁, because each position has its own weights."], "answer": 1, "explanation": "A stride-1 convolution applies the same filter at every position, so shifting the input shifts the response map by the same amount: f(Tₜ I) = Tₜ f(I). That is translation equivariance.", "option_notes": ["Wrong — invariance is what pooling (especially global pooling) approximately provides; convolution alone is equivariant.", "Correct — shared weights make the feature map move with the input.", "Wrong — flipping the kernel changes the filter, not the direction of the shift.", "Wrong — convolution shares weights across positions; position-specific weights describe an FC layer."]}, {"id": "S03-Q2", "session": 3, "topic": "Pooling", "difficulty": "Easy", "question": "A 2×2 max-pooling layer with stride 2 is applied to a 56×56×64 feature map. What are its number of learnable parameters and its output shape?", "options": ["256 parameters; 28×28×64", "64 parameters; 28×28×64", "0 parameters; 28×28×64", "0 parameters; 28×28×16"], "answer": 2, "explanation": "Pooling is a fixed operation with 0 parameters. Output side = ⌊(56 − 2)/2⌋ + 1 = 28, and pooling acts per channel so the 64 channels are kept.", "option_notes": ["Wrong — 256 = 2·2·64 treats the pooling window as learnable weights; max-pooling has none.", "Wrong — pooling has no per-channel scale or bias.", "Correct — 0 parameters, spatial size halved, channels unchanged.", "Wrong — pooling never changes the number of channels."]}, {"id": "S03-Q3", "session": 3, "topic": "Parameter count", "difficulty": "Medium", "question": "A convolution layer uses 3×3 kernels, receives an input with 64 channels and has 128 filters (with bias). How many learnable parameters does it have?", "options": ["1,280", "73,728", "147,584", "73,856"], "answer": 3, "explanation": "Params = (K·K·C_in + 1)·C_out = (9·64 + 1)·128 = 577·128 = 73,856.", "option_notes": ["Wrong — (9 + 1)·128 forgets that each kernel has depth C_in = 64.", "Wrong — 73,728 counts the weights but forgets the 128 biases.", "Wrong — (9·128 + 1)·128 uses C_out in place of C_in.", "Correct — (9·64 + 1)·128 = 73,856."]}, {"id": "S03-Q4", "session": 3, "topic": "Receptive field", "difficulty": "Medium", "question": "A network applies, in order: conv 3×3 (stride 1) → conv 3×3 (stride 1) → max-pool 2×2 (stride 2) → conv 3×3 (stride 1). What is the theoretical receptive field of one unit in the final layer, in input pixels?", "options": ["10×10", "8×8", "7×7", "14×14"], "answer": 0, "explanation": "Using r_l = r_(l−1) + (K_l − 1)·j_(l−1), j_l = j_(l−1)·S_l: r goes 1 → 3 → 5 → 6 (pool, jump becomes 2) → 6 + 2·2 = 10.", "option_notes": ["Correct — the conv after the pool adds (3 − 1)·2 = 4 because the jump is now 2.", "Wrong — 8 forgets to multiply by the jump of 2 after the stride-2 pool.", "Wrong — 7 ignores the pooling layer entirely.", "Wrong — 14 is the receptive field one conv layer later."]}, {"id": "S03-Q5", "session": 3, "topic": "ResNet degradation", "difficulty": "Medium", "question": "In the ResNet paper, a 56-layer plain CNN (with BatchNorm) had a higher TRAINING error than a 20-layer plain CNN on CIFAR-10. Which explanation is correct?", "options": ["Overfitting: the deeper network has more parameters, so it memorises the training set.", "Too little data: stronger data augmentation would remove the gap.", "Pooling layers in deeper networks destroy too much spatial information.", "An optimisation difficulty (degradation): the solver fails to find even the solution 'shallow net + identity layers', which would be no worse."], "answer": 3, "explanation": "Higher training error in the deeper net means it fits the data worse — an optimisation problem called degradation. A deeper net could copy the shallow one plus identity layers, so the solver is failing; residual connections y = F(x) + x fix this.", "option_notes": ["Wrong — overfitting gives lower training error and higher test error, the opposite of what was observed.", "Wrong — more data or augmentation targets the generalisation gap, not training error.", "Wrong — the problem is optimising depth, not pooling.", "Correct — this is the degradation problem that ResNet's identity shortcuts solve."]}, {"id": "S03-Q6", "session": 3, "topic": "Stacked 3×3 convolutions", "difficulty": "Medium", "question": "One 5×5 convolution (C channels in, C out) is replaced by two stacked 3×3 convolutions (C → C → C, ReLU in between). Ignoring biases, which statement is correct?", "options": ["The receptive field grows to 6×6 and the weights drop to 18C².", "The receptive field stays 5×5, but the weights increase because there are two layers.", "The receptive field stays 5×5, the weights drop from 25C² to 18C², and an extra non-linearity is added.", "The receptive field shrinks to 3×3, because each kernel is only 3×3."], "answer": 2, "explanation": "Two stride-1 3×3 layers give a receptive field of 1 + 2 + 2 = 5. Weights are 2·9C² = 18C² versus 25C² (28% fewer), and the ReLU between them adds non-linearity — the VGG argument.", "option_notes": ["Wrong — the receptive field is n(K − 1) + 1 = 5, not 6.", "Wrong — two layers of 9C² each (18C²) are still fewer than one 25C² layer.", "Correct — same receptive field, 28% fewer weights, more non-linearity.", "Wrong — stacking grows the receptive field; the second layer sees 3×3 units that each see 3×3 pixels."]}, {"id": "S03-Q7", "session": 3, "topic": "1×1 convolution", "difficulty": "Medium", "question": "A 1×1 convolution with 64 filters (stride 1, with bias) is applied to a 28×28×256 feature map. Which statement is correct?", "options": ["Output 28×28×256; it is an identity operation with 64 parameters.", "Output 28×28×64; it has (256 + 1)·64 = 16,448 parameters and mixes channels at every pixel.", "Output 28×28×64; it has 64·1·1 + 64 = 128 parameters.", "Output 1×1×64; it acts as global average pooling."], "answer": 1, "explanation": "A 1×1 conv keeps H×W and maps the 256 input channels to 64 at every pixel — a per-pixel linear layer across channels (a bottleneck). Params = (1·1·256 + 1)·64 = 16,448.", "option_notes": ["Wrong — the output has C_out = 64 channels and the layer is not an identity.", "Correct — channel reduction with 16,448 parameters, spatial size unchanged.", "Wrong — this forgets that the kernel depth equals C_in = 256.", "Wrong — spatial size is unchanged; global average pooling is a different, parameter-free operation."]}, {"id": "S03-Q8", "session": 3, "topic": "Architecture evolution", "difficulty": "Medium", "question": "Which architecture–key-idea pairing is correct?", "options": ["EfficientNet — compound scaling of depth, width and input resolution together.", "VGG-16 — Inception modules with parallel 1×1, 3×3 and 5×5 branches.", "AlexNet — identity shortcut connections that fix the degradation problem.", "GoogLeNet — about 138M parameters, most of them in three large FC layers."], "answer": 0, "explanation": "EfficientNet (2019) scales depth d = α^φ, width w = β^φ and resolution r = γ^φ jointly with α·β²·γ² ≈ 2 — compound scaling.", "option_notes": ["Correct — compound scaling is EfficientNet's key idea.", "Wrong — Inception modules belong to GoogLeNet; VGG uses only stacked 3×3 convs.", "Wrong — identity shortcuts are ResNet (2015); AlexNet's ideas were ReLU, dropout and GPU training.", "Wrong — ≈138M params mostly in FC layers describes VGG-16; GoogLeNet has ≈6.8M and uses global average pooling."]}, {"id": "S04-Q1", "session": 4, "topic": "Dropout", "difficulty": "Easy", "question": "A network contains nn.Dropout(p=0.5) (inverted dropout). After training you call model.eval() and run inference. What does the dropout layer do to its input?", "options": ["Randomly zeroes 50% of the activations and multiplies the rest by 2.", "Multiplies every activation by 0.5.", "Passes the activations through unchanged.", "Zeroes the same 50% of units that were dropped in the last training batch."], "answer": 2, "explanation": "With inverted dropout the 1/(1 − p) scaling is applied during training, so expected activations already match test time. In eval mode dropout is switched off and the layer is the identity.", "option_notes": ["Wrong — that is the training-mode behaviour (drop, then scale by 1/(1 − p) = 2).", "Wrong — scaling by the keep probability at test time belongs to the original non-inverted formulation; here it would wrongly halve activations.", "Correct — at test time inverted dropout is the identity.", "Wrong — masks are re-sampled every forward pass and never reused at inference."]}, {"id": "S04-Q2", "session": 4, "topic": "Learning curves", "difficulty": "Easy", "question": "Training loss decreases steadily for 40 epochs. Validation loss reaches its minimum at epoch 12 and then rises while the train–val gap keeps widening. What is the best diagnosis and first action?", "options": ["Underfitting — increase model capacity and train longer.", "Overfitting — keep the epoch-12 checkpoint (early stopping) and add regularisation/augmentation.", "Learning rate too low — increase it by 10×.", "The validation set must be corrupted — discard it and monitor training loss instead."], "answer": 1, "explanation": "Falling training loss with rising validation loss and a widening gap is the signature of overfitting. Keep the best checkpoint (early stopping) and add regularisation, augmentation, more data or pretrained weights.", "option_notes": ["Wrong — underfitting shows high training loss; here training loss keeps falling.", "Correct — classic overfitting; early stopping plus regularisation.", "Wrong — a too-low learning rate slows the decrease of both losses; it does not make validation loss rise.", "Wrong — training loss cannot reveal overfitting; the validation set is exactly what detects it."]}, {"id": "S04-Q3", "session": 4, "topic": "Data augmentation", "difficulty": "Easy", "question": "In a standard image-classification pipeline, where should random augmentations such as RandomResizedCrop, flips and colour jitter be applied?", "options": ["To the training, validation and test sets, so all splits look alike.", "To the validation set only, to make model selection more robust.", "To the test set only, to estimate worst-case performance.", "To the training set only; validation and test use a fixed resize, centre crop and normalisation."], "answer": 3, "explanation": "Random augmentation is a training-time regulariser. Validation and test must be deterministic so metrics are comparable across epochs and models and reflect deployment conditions.", "option_notes": ["Wrong — random validation/test transforms make metrics noisy and unrepresentative.", "Wrong — augmenting validation corrupts model selection and does not train a more robust model.", "Wrong — the test set should mirror real data; test-time augmentation that averages predictions is a separate, deliberate technique.", "Correct — augment training data only; keep evaluation deterministic."]}, {"id": "S04-Q4", "session": 4, "topic": "Feature extraction vs fine-tuning", "difficulty": "Medium", "question": "You have 2,000 labelled photos of 5 dog breeds (similar to ImageNet content) and an ImageNet-pretrained ResNet-50. Which FIRST strategy is most appropriate?", "options": ["Freeze the backbone (BN in eval mode), replace the head with a 5-way linear layer and train only the head.", "Train ResNet-50 from random initialisation, since the classes differ from ImageNet's.", "Fine-tune all layers with the original from-scratch learning rate of 0.1.", "Keep the 1000-way ImageNet head and map its predictions to breeds by name."], "answer": 0, "explanation": "Small dataset plus a domain similar to ImageNet calls for feature extraction: the pretrained features already separate breeds, and training only a 2048 → 5 head (10,245 params) avoids overfitting.", "option_notes": ["Correct — feature extraction is the right first step for small, similar-domain data.", "Wrong — 2,000 images are far too few to train ~23.5M parameters from scratch.", "Wrong — a large learning rate destroys the pretrained features.", "Wrong — the 1000-way head is tied to ImageNet's label set; a new head trained on the new data is needed."]}, {"id": "S04-Q5", "session": 4, "topic": "BatchNorm when freezing", "difficulty": "Medium", "question": "You set requires_grad=False on every backbone parameter of a pretrained ResNet, train only the new head, and call model.train() each epoch. What happens to the backbone's BatchNorm layers during training?", "options": ["Nothing changes — the backbone is completely frozen.", "γ and β are updated, but the running statistics stay fixed.", "They normalise with batch statistics and keep updating their running mean/variance, so the frozen features drift; the fix is to put them in eval mode.", "PyTorch raises an error because BN cannot run in train mode with frozen parameters."], "answer": 2, "explanation": "requires_grad=False only stops gradient updates of γ and β. In train mode BN still uses batch statistics and updates its running mean/variance buffers, so the 'frozen' features drift. Call .eval() on the frozen BN layers.", "option_notes": ["Wrong — the running statistics (buffers, not parameters) still change.", "Wrong — reversed: γ and β are frozen; the running statistics are what update.", "Correct — this is the classic silent fine-tuning bug.", "Wrong — no error is raised, which is why the bug goes unnoticed."]}, {"id": "S04-Q6", "session": 4, "topic": "AdamW", "difficulty": "Medium", "question": "What distinguishes AdamW from Adam with an L2 penalty added to the loss?", "options": ["AdamW replaces the L2 penalty by an L1 penalty to obtain sparse weights.", "Nothing — the two are mathematically identical for every optimiser.", "AdamW removes the momentum (first-moment) term to make decay stable.", "AdamW applies weight decay directly to the weights, decoupled from the adaptive gradient step, so the decay is not rescaled by 1/√v̂."], "answer": 3, "explanation": "AdamW applies θ ← θ − η·λ·θ separately from the adaptive step η·m̂/(√v̂ + ε). With Adam + L2 the penalty gradient λθ is divided by √v̂, so weights with large gradients are barely regularised.", "option_notes": ["Wrong — AdamW still uses a multiplicative (L2-type) decay, not L1.", "Wrong — L2 and weight decay are equivalent only for plain SGD, not for adaptive optimisers.", "Wrong — AdamW keeps both of Adam's moment estimates.", "Correct — decoupled weight decay is the defining difference."]}, {"id": "S04-Q7", "session": 4, "topic": "Mixup", "difficulty": "Medium", "question": "Mixup with λ = 0.3 combines image A (label 'cat') and image B (label 'dog') as x̃ = 0.3·x_A + 0.7·x_B. With label order [cat, dog], what is the training target?", "options": ["[1, 0] — the label of the first image.", "[0.3, 0.7]", "[0, 1] — the label of the dominant image.", "[0.5, 0.5] — mixup always uses equal weights for labels."], "answer": 1, "explanation": "Mixup mixes labels with the same coefficient as the images: ỹ = 0.3·[1, 0] + 0.7·[0, 1] = [0.3, 0.7].", "option_notes": ["Wrong — ignores that 70% of the image content is the dog.", "Correct — labels are mixed with the same λ as the images.", "Wrong — a hard label throws away the soft-target idea that makes mixup work.", "Wrong — label weights equal λ and 1 − λ, not 0.5 each."]}, {"id": "S04-Q8", "session": 4, "topic": "Label-preserving augmentation", "difficulty": "Medium", "question": "Which augmentation is most likely to change the true label of the training example?", "options": ["180° rotation for handwritten digit classification.", "Horizontal flip for cat-vs-dog classification.", "±10% brightness jitter for vehicle-type classification.", "A random crop covering 90% of the image for scene classification."], "answer": 0, "explanation": "Rotating a handwritten 6 by 180° produces a 9 (and vice versa), so the transformation changes the class — it is not label-preserving.", "option_notes": ["Correct — 6 and 9 swap under a 180° rotation.", "Wrong — a mirrored cat is still a cat; horizontal flip is the standard safe augmentation for natural images.", "Wrong — mild brightness changes do not change the vehicle type.", "Wrong — a 90% crop keeps almost all of the scene content."]}, {"id": "S05-Q1", "session": 5, "topic": "Siamese networks", "difficulty": "Easy", "question": "In a Siamese network used for signature verification, the two branches:", "options": ["are two independently trained CNNs whose outputs are concatenated and classified", "share the same weights, so both inputs are mapped into the same embedding space", "share weights only in the first convolutional layer and are free afterwards", "are trained with cross-entropy over all known signers and never compare distances"], "answer": 1, "explanation": "A Siamese network is one embedding network applied to both inputs with tied weights, so both signatures land in the same embedding space and the distance is symmetric; the decision thresholds d = ‖f(x₁) − f(x₂)‖.", "option_notes": ["Wrong — two independent networks would map inputs into different spaces, making distances meaningless.", "Correct — shared weights put both inputs in the same space and make the similarity symmetric.", "Wrong — the weights are shared through the whole network, not only the first layer.", "Wrong — cross-entropy over known signers cannot handle new signers; Siamese training uses a distance-based loss."]}, {"id": "S05-Q2", "session": 5, "topic": "Similarity metrics", "difficulty": "Easy", "question": "All gallery embeddings and the query embedding are L2-normalised. Ranking the gallery by increasing Euclidean distance to the query gives:", "options": ["the same order as ranking by increasing cosine similarity", "a different order in general, because Euclidean distance is sensitive to vector magnitude", "the same order only when the embedding dimension is small (D ≤ 3)", "the same order as ranking by decreasing cosine similarity"], "answer": 3, "explanation": "For unit vectors ‖â − b̂‖² = 2 − 2cos θ, a strictly decreasing function of cos θ, so the smallest distance corresponds to the largest cosine similarity.", "option_notes": ["Wrong — increasing cosine would list the least similar item first; the order is reversed.", "Wrong — magnitude sensitivity only matters for un-normalised vectors; here all norms are 1.", "Wrong — the identity ‖â − b̂‖² = 2 − 2cos θ holds in any dimension.", "Correct — smallest distance ⇔ largest cosine, so the rankings coincide."]}, {"id": "S05-Q3", "session": 5, "topic": "Contrastive learning: temperature", "difficulty": "Medium", "question": "In an InfoNCE / NT-Xent loss, the temperature is lowered from τ = 0.5 to τ = 0.05 with everything else unchanged. The softmax over the candidates becomes:", "options": ["sharper, so the loss concentrates on the hardest (most similar) negatives", "softer, so all negatives are weighted more equally", "unchanged, because τ cancels between numerator and denominator", "sharper for the positive only; the weights of the negatives are unaffected"], "answer": 0, "explanation": "Logits are sim/τ, so a smaller τ magnifies the gaps between logits and sharpens the softmax; the gradient on a negative (pₖ/τ) is then dominated by the hardest negatives.", "option_notes": ["Correct — lower τ sharpens the distribution and focuses the loss on hard negatives.", "Wrong — that is the effect of increasing τ (a classic trap).", "Wrong — τ divides each logit inside the exponential, so it does not cancel.", "Wrong — every logit is scaled by 1/τ, so the negatives' weights change too."]}, {"id": "S05-Q4", "session": 5, "topic": "SimCLR", "difficulty": "Medium", "question": "SimCLR is trained with a batch of N = 1024 images (two augmented views each). How many negatives does each anchor view have in its NT-Xent denominator?", "options": ["1023", "2047", "2046", "1024"], "answer": 2, "explanation": "There are 2N = 2048 views. Excluding the anchor itself and its positive partner leaves 2N − 2 = 2046 negatives.", "option_notes": ["Wrong — 1023 = N − 1 counts images and forgets that every other image contributes two views.", "Wrong — 2047 = 2N − 1 is the total number of denominator terms including the positive.", "Correct — 2N − 2 = 2046 negatives per anchor.", "Wrong — 1024 = N is not related to the number of other views."]}, {"id": "S05-Q5", "session": 5, "topic": "MoCo", "difficulty": "Medium", "question": "What is the main purpose of the momentum (key) encoder in MoCo?", "options": ["It computes gradients twice as fast, so training needs half the iterations", "It changes slowly (EMA of the query encoder), so keys stored in a large queue stay consistent and the number of negatives is decoupled from the batch size", "It removes the need for negatives entirely, exactly as in BYOL", "It is a separately trained network whose output is used as the downstream representation"], "answer": 1, "explanation": "MoCo keeps a queue of keys from past batches as negatives (K = 65,536). The key encoder is an EMA of the query encoder (θₖ ← 0.999θₖ + 0.001θ_q), so old and new keys remain consistent.", "option_notes": ["Wrong — the key encoder receives no gradients; it is not about back-propagation speed.", "Correct — slow EMA updates keep queued keys consistent, enabling many negatives independent of batch size.", "Wrong — MoCo does use negatives (the queue); BYOL is the method without negatives.", "Wrong — the key encoder is not separately trained, and downstream normally uses the query encoder."]}, {"id": "S05-Q6", "session": 5, "topic": "Triplet mining", "difficulty": "Medium", "question": "For an anchor–positive pair, d(a, p) = 0.40 and the triplet margin is m = 0.30. Which negative distance d(a, n) makes the triplet semi-hard?", "options": ["0.30", "0.80", "0.20", "0.60"], "answer": 3, "explanation": "Semi-hard means d(a,p) < d(a,n) < d(a,p) + m, i.e. 0.40 < d(a,n) < 0.70. Only 0.60 qualifies, giving loss 0.40 − 0.60 + 0.30 = 0.10.", "option_notes": ["Wrong — 0.30 is smaller than d(a,p) = 0.40, so it is a hard negative.", "Wrong — 0.80 exceeds d(a,p) + m = 0.70, so it is an easy negative with zero loss.", "Wrong — 0.20 is smaller than d(a,p), so it is a hard negative.", "Correct — 0.40 < 0.60 < 0.70, the semi-hard window."]}, {"id": "S05-Q7", "session": 5, "topic": "SimCLR projection head", "difficulty": "Medium", "question": "After SimCLR pre-training, which representation is normally used for downstream linear evaluation?", "options": ["The encoder output h, taken before the projection head", "The projection-head output z, because the loss was computed on it", "The concatenation of z from the two augmented views", "The row of the 2N × 2N similarity matrix belonging to the image"], "answer": 0, "explanation": "The loss is computed on z = g(h), but the projection head is discarded; h retains information (e.g. colour, orientation) that the contrastive objective removes from z, so it transfers better.", "option_notes": ["Correct — the projection head is thrown away and h is used downstream.", "Wrong — z is made invariant to the augmentations and loses useful information.", "Wrong — at test time there is a single image; concatenating views is not the protocol.", "Wrong — a similarity row depends on the batch and is not a representation of the image."]}, {"id": "S05-Q8", "session": 5, "topic": "Approximate nearest neighbour", "difficulty": "Medium", "question": "Which approximate-nearest-neighbour technique mainly reduces memory by replacing each stored vector with a few bytes of codebook indices?", "options": ["HNSW (hierarchical navigable small-world graph)", "IVF (inverted file) storing the full float vectors", "Product quantisation (PQ)", "A brute-force flat index on a GPU"], "answer": 2, "explanation": "Product quantisation splits each vector into m sub-vectors and stores only the 1-byte index of the nearest centroid for each, so a 512-d float32 vector (2048 bytes) becomes 64 bytes with m = 64.", "option_notes": ["Wrong — HNSW stores the full vectors plus graph links, so it uses more memory, not less.", "Wrong — IVF without PQ reduces the number of comparisons, not the memory per vector.", "Correct — PQ compresses each vector to m bytes of codebook indices.", "Wrong — a flat index stores every vector uncompressed."]}, {"id": "S06-Q1", "session": 6, "topic": "Detection vs localisation", "difficulty": "Easy", "question": "Which property distinguishes object detection from classification + localisation?", "options": ["Detection predicts a single class label for the whole image.", "Detection must output a variable-size set of (class, box, score) triples and therefore needs an explicit background class and duplicate removal.", "Detection uses a box-regression loss whereas classification + localisation does not.", "Detection outputs a class label for every pixel."], "answer": 1, "explanation": "Detection must find all instances, so the number of outputs is unknown in advance. This forces a background class, duplicate removal (NMS) and set-based evaluation (AP).", "option_notes": ["Wrong — that is image classification.", "Correct — variable number of objects is the defining difficulty of detection.", "Wrong — classification + localisation also regresses one box (CE + L2 or smooth-L1).", "Wrong — that is semantic segmentation."]}, {"id": "S06-Q2", "session": 6, "topic": "HOG", "difficulty": "Medium", "question": "Which HOG configuration did Dalal & Triggs find to work best for pedestrian detection?", "options": ["Gaussian smoothing (σ = 2) followed by Sobel gradients, 18 signed bins over 0–360°.", "Non-overlapping 16×16-pixel blocks with L1 normalisation and 9 signed bins over 0–360°.", "Unsmoothed centred [−1, 0, 1] gradients, 9 unsigned bins over 0–180°, 8×8-pixel cells, overlapping 2×2-cell blocks with L2-Hys normalisation.", "4×4-pixel cells, 36 unsigned bins and no block normalisation."], "answer": 2, "explanation": "The simplest unsmoothed [−1, 0, 1] derivative, 9 unsigned bins, 8×8 cells and overlapping 2×2-cell blocks with L2-Hys worked best; a 64×128 window gives 7×15 blocks × 36 = 3780 dimensions.", "option_notes": ["Wrong — smoothing hurt performance and signed orientation did not help for pedestrians.", "Wrong — blocks overlap (stride one cell); overlapping blocks with L2-Hys clearly beat non-overlapping ones.", "Correct — these are the standard Dalal–Triggs settings.", "Wrong — without block normalisation the descriptor loses illumination invariance; these are not the standard settings."]}, {"id": "S06-Q3", "session": 6, "topic": "Viola–Jones", "difficulty": "Easy", "question": "In the Viola–Jones face detector, the main purpose of the attentional cascade is to:", "options": ["reject most background windows in early stages that use very few features, so the average cost per window is tiny.", "compute any rectangle sum in constant time.", "select the most discriminative Haar features from the huge feature pool.", "make the detector invariant to in-plane rotation."], "answer": 0, "explanation": "The cascade is an early-rejection device: cheap first stages discard most non-face windows, so the expensive later stages run on very few windows.", "option_notes": ["Correct — early rejection makes the average cost per window a handful of features.", "Wrong — that is the integral image.", "Wrong — that is AdaBoost feature selection.", "Wrong — Viola–Jones handles near-frontal, upright faces only."]}, {"id": "S06-Q4", "session": 6, "topic": "R-CNN", "difficulty": "Medium", "question": "The main reason R-CNN needs tens of seconds per image at test time is that:", "options": ["selective search alone takes tens of seconds per image.", "its per-class SVMs use expensive non-linear kernels.", "NMS over about 2000 boxes has quadratic cost.", "the CNN is run separately on each of about 2000 warped proposals, repeating heavily overlapping computation."], "answer": 3, "explanation": "R-CNN warps each of ~2000 proposals to 227×227 and runs a full CNN forward pass on each one, so overlapping regions are processed again and again.", "option_notes": ["Wrong — selective search costs seconds; it only becomes the bottleneck in Fast R-CNN.", "Wrong — R-CNN uses linear SVMs, which are cheap dot products.", "Wrong — NMS over a few thousand boxes is negligible next to 2000 CNN passes.", "Correct — about 2000 CNN forward passes per image."]}, {"id": "S06-Q5", "session": 6, "topic": "Fast R-CNN", "difficulty": "Medium", "question": "Which statement about Fast R-CNN is correct?", "options": ["RoI pooling makes the whole system, including region proposals, trainable end-to-end.", "All proposals share one convolutional pass over the image, but proposals still come from an external selective-search step.", "It replaced selective search with a Region Proposal Network.", "It classifies each RoI with per-class linear SVMs trained on features cached on disk."], "answer": 1, "explanation": "Fast R-CNN computes the feature map once, RoI-pools each proposal and trains classifier and regressor jointly, but the proposals are still selective-search inputs — end-to-end except proposals.", "option_notes": ["Wrong — classic trap: proposals are not learned in Fast R-CNN.", "Correct — shared computation, external proposals.", "Wrong — the RPN was introduced by Faster R-CNN.", "Wrong — that describes R-CNN; Fast R-CNN uses a softmax over K+1 classes."]}, {"id": "S06-Q6", "session": 6, "topic": "RPN", "difficulty": "Easy", "question": "An RPN uses k = 9 anchors per location and, as in the original paper, a two-class softmax (object / not object) per anchor. How many output channels do the cls and reg 1×1 conv layers have, respectively?", "options": ["18 and 36", "2 and 4", "18 and 4", "36 and 18"], "answer": 0, "explanation": "cls has 2k = 18 channels (two scores per anchor) and reg has 4k = 36 channels (four offsets per anchor), i.e. 54 outputs per location.", "option_notes": ["Correct — 2k and 4k with k = 9.", "Wrong — that ignores the k anchors (it would be k = 1).", "Wrong — 4 regression channels would give one box per location, not one per anchor.", "Wrong — swapped: regression needs 4 numbers per anchor and classification 2."]}, {"id": "S06-Q7", "session": 6, "topic": "Anchors", "difficulty": "Medium", "question": "Which statement about anchors in Faster R-CNN is correct?", "options": ["Anchor scales and aspect ratios are learned by back-propagation together with the RPN weights.", "Each anchor is a box produced by the RPN's regression branch.", "Anchors are only placed at locations whose objectness score exceeds 0.7.", "Anchors are fixed reference boxes at every feature-map location; the network learns objectness and offsets relative to them."], "answer": 3, "explanation": "Anchors are hand-chosen priors (3 scales × 3 ratios) tiled at every location; the RPN learns whether each anchor contains an object and the offsets (tx, ty, tw, th) that move it onto the object.", "option_notes": ["Wrong — scales and ratios are hyper-parameters, not learned weights.", "Wrong — the regression branch predicts offsets relative to anchors; decoded boxes are proposals.", "Wrong — anchors are placed densely at every location; 0.7 is the IoU threshold for positive training labels.", "Correct — fixed priors, learned objectness and offsets."]}, {"id": "S06-Q8", "session": 6, "topic": "NMS in Faster R-CNN", "difficulty": "Medium", "question": "Where is non-maximum suppression used in standard Faster R-CNN inference?", "options": ["Nowhere — the RPN makes NMS unnecessary.", "Only on the final class-specific detections.", "On the RPN proposals (IoU about 0.7) and again per class on the final detections.", "Only on the anchors, before the RPN is run."], "answer": 2, "explanation": "NMS at IoU 0.7 reduces thousands of decoded anchors to about 300 proposals, and per-class NMS removes duplicate final detections — NMS is used twice.", "option_notes": ["Wrong — Faster R-CNN does not remove NMS; set-prediction detectors like DETR do.", "Wrong — it misses the proposal-level NMS.", "Correct — NMS is applied twice.", "Wrong — anchors are fixed priors; NMS operates on scored, decoded boxes."]}, {"id": "S07-Q1", "session": 7, "topic": "YOLO", "difficulty": "Easy", "question": "YOLOv1 on PASCAL VOC uses an S = 7 grid, B = 2 boxes per cell and C = 20 classes. What is the shape of its output tensor?", "options": ["7×7×25", "7×7×24", "7×7×30", "7×7×50"], "answer": 2, "explanation": "S × S × (5B + C) = 7 × 7 × (5·2 + 20) = 7×7×30: each of the 2 boxes has (x, y, w, h, conf) and the 20 class probabilities are shared per cell.", "option_notes": ["Wrong — 5 + 20 = 25 assumes only one box per cell.", "Wrong — 4 + 20 = 24 forgets the confidence and the second box.", "Correct — 5B + C = 30 channels.", "Wrong — 2 × (5 + 20) = 50 gives each box its own class probabilities, which YOLOv1 does not do."]}, {"id": "S07-Q2", "session": 7, "topic": "NMS", "difficulty": "Medium", "question": "A detector's NMS IoU threshold is raised from 0.5 to 0.7. What is the effect on the final detections?", "options": ["Fewer boxes are suppressed, so more boxes (including possible duplicates) survive.", "More boxes are suppressed, so fewer boxes survive.", "The same boxes survive; only their scores change.", "All boxes with confidence below 0.7 are removed."], "answer": 0, "explanation": "A box is suppressed only when its IoU with a higher-scoring box exceeds the threshold, so a higher threshold removes fewer boxes: better recall on overlapping objects but more duplicates.", "option_notes": ["Correct — higher threshold means fewer suppressions.", "Wrong — classic trap; that is the effect of lowering the threshold.", "Wrong — greedy NMS never changes scores (Soft-NMS does).", "Wrong — this confuses the IoU threshold with a confidence threshold."]}, {"id": "S07-Q3", "session": 7, "topic": "AP", "difficulty": "Easy", "question": "The Average Precision (AP) of an object detector for one class is the area under which curve?", "options": ["The ROC curve (true-positive rate vs false-positive rate).", "Recall plotted against the IoU threshold.", "Precision plotted against the confidence threshold.", "The (interpolated) precision–recall curve."], "answer": 3, "explanation": "AP is the area under the precision–recall curve, made monotone with the precision envelope (all-point, 11-point or 101-point interpolation).", "option_notes": ["Wrong — ROC needs true negatives, which are undefined in detection.", "Wrong — recall vs IoU threshold is a different diagnostic (average recall).", "Wrong — AP integrates precision over recall, not over the confidence threshold.", "Correct — area under the interpolated PR curve."]}, {"id": "S07-Q4", "session": 7, "topic": "mAP", "difficulty": "Easy", "question": "COCO's primary metric, AP = mAP@[.5:.95], averages AP over:", "options": ["5 IoU thresholds (0.5, 0.6, 0.7, 0.8, 0.9).", "10 IoU thresholds (0.50, 0.55, …, 0.95) and over all classes.", "the two IoU thresholds 0.5 and 0.95 only.", "10 confidence thresholds from 0.50 to 0.95."], "answer": 1, "explanation": "COCO AP averages over IoU thresholds 0.50 to 0.95 in steps of 0.05 (10 values) and over the 80 classes, using 101-point interpolated AP at each.", "option_notes": ["Wrong — wrong step and count; there are 10 thresholds, not 5.", "Correct — 10 IoU thresholds and all classes.", "Wrong — intermediate thresholds are included.", "Wrong — the thresholds are on IoU, not on confidence."]}, {"id": "S07-Q5", "session": 7, "topic": "Focal loss", "difficulty": "Medium", "question": "In the focal loss FL(p_t) = −α_t (1 − p_t)^γ log p_t, what happens when γ = 0?", "options": ["The loss becomes zero for every example.", "Only misclassified examples contribute to the loss.", "It reduces to the α-balanced cross-entropy loss.", "It becomes the smooth-L1 loss."], "answer": 2, "explanation": "With γ = 0 the modulating factor (1 − p_t)^0 = 1, so FL = −α_t log p_t, the α-balanced cross-entropy.", "option_notes": ["Wrong — (1 − p_t)^0 equals 1, not 0.", "Wrong — that would need a large γ; with γ = 0 every example counts fully.", "Correct — the modulating factor disappears.", "Wrong — smooth-L1 is a box-regression loss."]}, {"id": "S07-Q6", "session": 7, "topic": "Anchor-free (FCOS)", "difficulty": "Medium", "question": "Which statement about FCOS is correct?", "options": ["It needs no NMS because centre-ness guarantees exactly one prediction per object.", "It places 9 anchors at every location of every FPN level.", "It assigns each GT box to the FPN level whose anchors have the highest IoU with it.", "Each location regresses the distances (l, t, r, b) to the box sides, and a centre-ness score down-weights off-centre predictions before NMS."], "answer": 3, "explanation": "FCOS is anchor-free: locations inside a GT box regress (l, t, r, b); centre-ness multiplies the class score so off-centre boxes rank low, and NMS is still applied.", "option_notes": ["Wrong — anchor-free does not mean NMS-free; FCOS uses NMS.", "Wrong — that describes RetinaNet; FCOS makes one prediction per location.", "Wrong — FCOS assigns levels by the range of max(l, t, r, b) (0/64/128/256/512), not by anchor IoU.", "Correct — distances plus centre-ness, then NMS."]}, {"id": "S07-Q7", "session": 7, "topic": "SSD", "difficulty": "Easy", "question": "How does SSD handle the very large number of negative default boxes during training?", "options": ["It sorts negatives by confidence loss and keeps the hardest ones so that negatives : positives ≤ 3 : 1.", "It uses all 8732 boxes with equal weight.", "It samples random negatives at a 1 : 1 ratio with positives.", "It down-weights easy negatives with a focal loss with γ = 2."], "answer": 0, "explanation": "SSD uses hard-negative mining: negatives are ranked by confidence loss and only the hardest are kept, at most 3 negatives per positive.", "option_notes": ["Correct — hard-negative mining at 3:1.", "Wrong — using all boxes lets easy negatives dominate the loss.", "Wrong — SSD keeps the hardest negatives, not random ones, at 3:1.", "Wrong — focal loss was introduced later by RetinaNet."]}, {"id": "S07-Q8", "session": 7, "topic": "CenterNet", "difficulty": "Medium", "question": "How does CenterNet (\"Objects as Points\") remove duplicate detections at inference?", "options": ["Greedy NMS with an IoU threshold of 0.5.", "It keeps only heatmap locations whose value equals their 3×3 max-pooled value (local peaks).", "Hungarian matching between predictions at inference time.", "Soft-NMS with a Gaussian score decay."], "answer": 1, "explanation": "Each object is a heatmap peak; a 3×3 max-pool keeps local maxima and the top-100 peaks are decoded into boxes, so no IoU-based NMS is needed.", "option_notes": ["Wrong — avoiding NMS is one of CenterNet's selling points.", "Correct — peak extraction by 3×3 max-pooling.", "Wrong — Hungarian matching is used by DETR during training, not at inference.", "Wrong — Soft-NMS is still a form of NMS, which CenterNet does not need."]}, {"id": "S08-Q1", "session": 8, "topic": "DETR heads", "difficulty": "Easy", "question": "In DETR, the classification head applied to each object query outputs a probability distribution over:", "options": ["the C object classes only, with a separate sigmoid objectness score", "C + 1 classes, the extra class being \"no object\" (∅)", "two classes (object / background), followed by a second-stage classifier", "the C object classes, with background handled by NMS"], "answer": 1, "explanation": "DETR's class FFN is a linear layer + softmax over C + 1 classes; the extra class ∅ (no object) is what the unused queries predict.", "option_notes": ["Wrong — there is no separate objectness score; \"no object\" is just one more softmax class.", "Correct — softmax over C + 1 classes including ∅.", "Wrong — DETR is end-to-end; there is no second-stage classifier.", "Wrong — DETR uses no NMS, and background must be predicted explicitly as ∅."]}, {"id": "S08-Q2", "session": 8, "topic": "Hungarian loss", "difficulty": "Medium", "question": "A training image contains 7 ground-truth objects and DETR uses N = 100 object queries. After Hungarian matching, how many queries contribute an L1 + GIoU box loss for this image (per decoder layer)?", "options": ["100 — every query regresses a box", "93 — the queries matched to \"no object\"", "7 — only the queries matched to real objects", "however many queries have IoU > 0.5 with some ground-truth box"], "answer": 2, "explanation": "Matching assigns the 7 objects to 7 distinct queries; only those get the box loss. The other 93 are matched to ∅ and get only the 0.1-weighted classification loss.", "option_notes": ["Wrong — queries matched to ∅ have no box target.", "Wrong — these are exactly the queries without a box loss.", "Correct — one-to-one matching gives exactly 7 matched queries.", "Wrong — DETR uses one-to-one cost-based matching, not IoU-threshold assignment."]}, {"id": "S08-Q3", "session": 8, "topic": "Object queries", "difficulty": "Medium", "question": "Which statement about DETR's object queries is correct?", "options": ["They are learned embedding vectors, identical for every image; the decoder turns them into image-specific outputs through cross-attention to the encoder memory.", "They are region proposals produced by a region proposal network on the backbone features.", "They are 100 fixed anchor boxes of different scales and aspect ratios placed on the image.", "They are the 100 highest-scoring flattened encoder tokens of the current image."], "answer": 0, "explanation": "Object queries are N × d learned parameters (learnt positional encodings), the same for all images; image content enters only through decoder cross-attention.", "option_notes": ["Correct — learned, image-independent embeddings; outputs become image-specific via cross-attention.", "Wrong — DETR has no RPN or proposals.", "Wrong — DETR has no anchors; queries carry no fixed box geometry.", "Wrong — encoder tokens are the memory (keys/values), not the queries."]}, {"id": "S08-Q4", "session": 8, "topic": "No NMS", "difficulty": "Medium", "question": "What is the main reason DETR does not need non-maximum suppression?", "options": ["A confidence threshold of 0.7 at inference removes all duplicate boxes.", "It uses only 100 queries, far fewer than the anchors of a one-stage detector.", "The GIoU loss pushes overlapping predicted boxes away from each other.", "One-to-one bipartite matching in training penalises duplicate predictions (they are matched to \"no object\"), and decoder self-attention lets queries coordinate."], "answer": 3, "explanation": "Only one query can be matched to each object, so a duplicate is matched to ∅ and its confident class score is penalised; decoder self-attention lets queries agree on who predicts which object.", "option_notes": ["Wrong — a threshold removes low-confidence predictions, not confident duplicates.", "Wrong — 100 queries could still all fire on one object; the count alone prevents nothing.", "Wrong — GIoU loss compares a prediction only with its own matched ground-truth box.", "Correct — one-to-one matching plus query self-attention replaces NMS."]}, {"id": "S08-Q5", "session": 8, "topic": "Deformable DETR", "difficulty": "Medium", "question": "Deformable DETR reaches better accuracy than DETR with about 10× fewer training epochs. The key change is that:", "options": ["Hungarian matching is replaced by IoU-threshold assignment to anchors.", "the ResNet backbone uses deformable convolutions instead of standard convolutions.", "each query attends to only a few sampling points (learned offsets around a reference point) per head and per level of a multi-scale feature pyramid.", "the transformer encoder is removed and the decoder attends directly to the backbone."], "answer": 2, "explanation": "Multi-scale deformable attention samples only K points per head per level at offsets predicted from the query: sparse, focused attention converges fast, costs linear in HW, and makes high-resolution levels affordable.", "option_notes": ["Wrong — Deformable DETR keeps Hungarian matching and stays NMS-free.", "Wrong — the deformable part is the attention module, not the backbone convolutions.", "Correct — sparse multi-scale deformable attention.", "Wrong — the encoder is kept, using deformable self-attention over multi-scale maps."]}, {"id": "S08-Q6", "session": 8, "topic": "Grounding DINO", "difficulty": "Easy", "question": "In the open-vocabulary detector Grounding DINO, \"DINO\" refers to:", "options": ["self-DIstillation with NO labels — the self-supervised ViT training method", "DETR with Improved deNoising anchOr boxes — a DETR-style detector", "Detection In Natural Open-world — a dataset of open-world images", "the DINOv2 backbone, which is the only pretrained component of the model"], "answer": 1, "explanation": "Grounding DINO extends the DINO detector (DETR with Improved deNoising anchOr boxes) with text grounding; it is not the self-supervised DINO.", "option_notes": ["Wrong — classic trap: self-supervised DINO is a different method.", "Correct — the DINO detector.", "Wrong — invented expansion; no such dataset is involved.", "Wrong — the name refers to the detector architecture, not a DINOv2 backbone."]}, {"id": "S08-Q7", "session": 8, "topic": "Detector error analysis", "difficulty": "Medium", "question": "In a TIDE-style error analysis (foreground threshold 0.5, background threshold 0.1), a detection labelled \"dog\" has IoU 0.35 with a ground-truth \"dog\" box and IoU < 0.1 with every other ground-truth box. This false positive is counted as a:", "options": ["classification error", "duplicate detection error", "background error", "localisation error"], "answer": 3, "explanation": "Correct class with 0.1 ≤ IoU = 0.35 < 0.5: the box is roughly in the right place but not accurate enough, so it is a localisation error.", "option_notes": ["Wrong — a classification error needs IoU ≥ 0.5 with a ground truth of a different class.", "Wrong — a duplicate needs IoU ≥ 0.5 with a ground truth already matched by a higher-scoring detection.", "Wrong — background needs IoU < 0.1 with every ground truth; here IoU with the dog is 0.35.", "Correct — right class, IoU between the background and foreground thresholds."]}, {"id": "S09-Q1", "session": 9, "topic": "Choosing a detector", "difficulty": "Easy", "question": "A start-up must detect 12 fixed classes of road damage in dash-cam video at ≥ 30 fps on an embedded GPU. It has 15,000 labelled boxes. Which detector family is the most appropriate first choice?", "options": ["R-CNN with selective-search proposals and per-class linear SVMs.", "A one-stage detector from the YOLO family, fine-tuned from pretrained weights.", "The original DETR (ResNet-50, 100 object queries) trained from scratch on the 12 classes.", "Grounding DINO prompted with the 12 class names, run on every frame."], "answer": 1, "explanation": "One-stage detectors predict classes and boxes densely in a single pass and run in real time on edge GPUs; with 15,000 labelled boxes and a fixed class list, fine-tuning a pretrained YOLO-family model is the natural first choice.", "option_notes": ["Wrong — R-CNN runs the CNN on about 2,000 warped proposals per image (tens of seconds per image), far too slow for 30 fps.", "Correct — real-time, accurate on a fixed class list, and easy to fine-tune from pretrained weights.", "Wrong — the original DETR needs about 500 training epochs, is weak on small objects and is not a real-time edge detector.", "Wrong — open-vocabulary detectors are slow (hundreds of ms per frame) and less accurate than a fine-tuned closed-set detector on fixed classes; use them for auto-labelling instead."]}, {"id": "S09-Q2", "session": 9, "topic": "Metrics under imbalance", "difficulty": "Easy", "question": "A leaf-disease classifier is tested on 1,000 images: 950 healthy and 50 diseased. Which evaluation best shows how useful the classifier is?", "options": ["Overall accuracy, because it uses all 1,000 test images.", "Top-5 accuracy, because it is more forgiving than top-1.", "The confusion matrix with per-class precision and recall, summarised by macro-F1 or balanced accuracy.", "Mean IoU between the predicted and true labels."], "answer": 2, "explanation": "A model that always predicts healthy already scores 95% accuracy while finding no disease; per-class precision/recall, macro-F1 and balanced accuracy expose this failure.", "option_notes": ["Wrong — accuracy is dominated by the 95% majority class.", "Wrong — with only two classes, top-5 accuracy is always 100% and says nothing.", "Correct — per-class metrics and macro averages treat the rare diseased class as equally important.", "Wrong — mean IoU is a segmentation (pixel-overlap) metric, not an image-classification metric."]}, {"id": "S09-Q3", "session": 9, "topic": "Choosing a geometry model", "difficulty": "Medium", "question": "A calibrated handheld camera (K known) takes two photos while walking around a statue (a general 3-D scene; the camera translates). You want the relative rotation and translation direction from SIFT matches. Which model and minimal RANSAC sample should you use?", "options": ["A homography, estimated from 4-point samples.", "An affine transform, estimated from 3-point samples.", "A fundamental matrix from 8-point samples, then read R and t directly from F without using K.", "An essential matrix from 5-point samples, then decompose it into R and t (up to scale) with a cheirality check."], "answer": 3, "explanation": "Translation in front of a 3-D scene creates parallax, so epipolar geometry is needed; with K known the essential matrix (5 DOF, 5-point solver, 146 RANSAC iterations at e = 0.5, p = 0.99) gives R and the direction of t after a cheirality check.", "option_notes": ["Wrong — a homography is exact only for a planar scene or pure rotation.", "Wrong — an affine model is even more restrictive (weak perspective, parallelism preserved).", "Wrong — F lives in pixel coordinates and fixes the cameras only up to a projective ambiguity; K is needed (E = K′ᵀFK) to get metric R and t.", "Correct — calibrated two-view geometry of a general scene is described by E; the translation scale is unobservable."]}, {"id": "S09-Q4", "session": 9, "topic": "Data leakage", "difficulty": "Medium", "question": "A dataset has 6,000 skin-lesion photos from 1,500 patients (several photos per lesion). Which protocol gives an honest test estimate?", "options": ["Split by patient ID (stratified by class) so all photos of a patient fall in one split, and fit any normalisation statistics on the training split only.", "Shuffle all 6,000 images and split 70/15/15 at image level, stratified by class.", "Make 5 augmented copies of every image, then split the enlarged set 70/15/15.", "Train on all the data and report the final-epoch accuracy on the training set as the test result."], "answer": 0, "explanation": "Photos of the same patient (often the same lesion) are near-duplicates; a group split by patient plus train-only statistics measures generalisation to new patients, which is what deployment needs.", "option_notes": ["Correct — group-aware, stratified splitting with statistics fitted on train only prevents leakage.", "Wrong — the same lesion appears in train and test, inflating the score.", "Wrong — augmented copies of one image end up in both train and test (augment-then-split leakage).", "Wrong — training accuracy measures memorisation, not generalisation."]}, {"id": "S09-Q5", "session": 9, "topic": "Embedding retrieval evaluation", "difficulty": "Medium", "question": "In the embedding practical a student uses every gallery image as a query against the full gallery and reports P@1 = 100% and mAP ≈ 0.98 for frozen ResNet-50 features on 50 plant species. What is the most likely explanation?", "options": ["ImageNet ResNet-50 features separate plant species perfectly, so the result is expected.", "Each query retrieves itself at rank 1 with cosine similarity 1; the self-match must be excluded before computing the metrics.", "L2-normalising the embeddings always inflates P@1.", "mAP should have been computed with 11-point interpolation, which would lower it to a realistic value."], "answer": 1, "explanation": "When the query set is the gallery, every query's nearest neighbour is itself (cosine similarity exactly 1), giving P@1 = 100% and an inflated mAP; remove the self-match (leave-one-out) before ranking.", "option_notes": ["Wrong — off-the-shelf features are good but not perfect on 50 fine-grained species; a perfect score is a red flag.", "Correct — the classic self-match bug in retrieval evaluation.", "Wrong — normalisation only makes the ranking cosine-based; it cannot create perfect retrieval.", "Wrong — a different AP averaging convention does not remove the self-match bug."]}, {"id": "S09-Q6", "session": 9, "topic": "t-SNE / UMAP caveats", "difficulty": "Medium", "question": "Which statement about a t-SNE plot of image embeddings is correct?", "options": ["t-SNE is a linear, deterministic projection, so two runs always give the same plot.", "If two classes appear as well-separated clusters, a linear probe on the original features must reach 100% accuracy on them.", "The gap between two clusters in the plot measures how different the two classes are in the original embedding space.", "Cluster sizes and gaps can change with perplexity and the random seed, so the plot is only a qualitative check and metrics must be computed in the original space."], "answer": 3, "explanation": "t-SNE preserves local neighbourhoods only; cluster sizes and inter-cluster distances depend on perplexity and the seed, so the plot is a qualitative sanity check and accuracy or retrieval metrics must be computed on the original embeddings.", "option_notes": ["Wrong — t-SNE is non-linear and stochastic; PCA is the linear, deterministic method.", "Wrong — 2-D separation does not imply linear separability or perfect accuracy in the original space.", "Wrong — distances between t-SNE clusters are not meaningful.", "Correct — treat t-SNE/UMAP plots as qualitative only."]}, {"id": "S09-Q7", "session": 9, "topic": "Foundation-model capabilities", "difficulty": "Medium", "question": "Which model–usage pairing works out of the box, with no extra model, labelled data or calibration?", "options": ["CLIP: classify images into new categories using only text prompts of the class names.", "DINOv2: zero-shot classification by comparing image features with class-name prompts.", "SAM: output a class label for every mask it produces in a street scene.", "Depth Anything: report the distance to a pedestrian in metres from a single image."], "answer": 0, "explanation": "CLIP's image and text encoders share one embedding space, so prompts such as 'a photo of a {class}.' act as a zero-shot classifier without any labels or training.", "option_notes": ["Correct — zero-shot classification by text prompts is CLIP's defining capability.", "Wrong — DINOv2 has no text encoder; it needs labelled examples for kNN or a linear probe.", "Wrong — SAM masks are class-agnostic; labels must come
