from another model such as Grounding DINO or CLIP.", "Wrong — Depth Anything outputs relative (affine-invariant) inverse depth; metres need metric fine-tuning or calibration with at least two known depths."]}, {"id": "S09-Q8", "session": 9, "topic": "Choosing a segmentation model", "difficulty": "Medium", "question": "A fruit-picking robot must outline each individual apple (apples often touch and overlap) and know which masks are apples and which are leaves. You have 3,000 images with instance masks for both classes. Which model fits best?", "options": ["U-Net trained for semantic segmentation.", "FCN-8s trained for semantic segmentation.", "Mask R-CNN fine-tuned on the instance masks.", "SAM in automatic 'segment everything' mode, with no other model."], "answer": 2, "explanation": "The task needs separate instances with class labels, and labelled instance masks are available, so Mask R-CNN (class, box, score and mask per instance) is the right tool.", "option_notes": ["Wrong — semantic segmentation merges touching apples into one blob, so individual apples cannot be outlined or counted.", "Wrong — same problem as U-Net, with coarser boundaries.", "Correct — instance segmentation with class labels, fine-tuned on the available instance masks.", "Wrong — SAM's automatic masks carry no class labels, so it cannot tell apples from leaves without another model."]}, {"id": "S10-Q1", "session": 10, "topic": "Segmentation task types", "difficulty": "Easy", "question": "A street-scene model must give every pixel a class label (road, sky, car, person) and give each individual car and person its own ID. Which task is this?", "options": ["Semantic segmentation", "Instance segmentation", "Panoptic segmentation", "Object detection followed by NMS"], "answer": 2, "explanation": "Panoptic segmentation labels every pixel with a class (stuff such as road and sky) and gives each countable object (things such as cars and people) its own instance ID.", "option_notes": ["Wrong — semantic segmentation gives class labels only; touching cars would merge into one region.", "Wrong — instance segmentation separates objects but leaves stuff (road, sky) unlabelled.", "Correct — class for every pixel plus instance IDs for things.", "Wrong — detection outputs boxes, not pixel labels."]}, {"id": "S10-Q2", "session": 10, "topic": "U-Net", "difficulty": "Easy", "question": "How does U-Net combine encoder features with decoder features at the same resolution level?", "options": ["It concatenates the (cropped) encoder feature maps with the up-sampled decoder maps along the channel dimension.", "It adds class-score maps element-wise, as in FCN-8s.", "It passes the max-pooling indices to the decoder, which unpools with them.", "It multiplies the decoder features by an attention map computed from the encoder."], "answer": 0, "explanation": "U-Net copies the encoder feature map, centre-crops it and concatenates it with the up-convolved decoder map along channels; the following convolutions learn how to mix them.", "option_notes": ["Correct — skip connections by concatenation.", "Wrong — addition of score maps is FCN's skip fusion.", "Wrong — passing pooling indices is SegNet's mechanism.", "Wrong — that describes attention-gated variants, not the original U-Net."]}, {"id": "S10-Q3", "session": 10, "topic": "RoIAlign", "difficulty": "Medium", "question": "RoIAlign improves on RoI Pool because it:", "options": ["rounds RoI coordinates to the nearest feature cell before pooling, which removes sub-pixel noise.", "keeps floating-point RoI and bin coordinates and computes features at regularly sampled points by bilinear interpolation.", "aligns every RoI with its nearest anchor box before pooling.", "resizes each RoI crop of the input image to 224×224 before running the backbone."], "answer": 1, "explanation": "RoIAlign performs no quantisation: exact RoI and bin boundaries, regular sampling points per bin, bilinear interpolation from the 4 neighbouring cells, then averaging.", "option_notes": ["Wrong — rounding is exactly what RoI Pool does and what causes misalignment.", "Correct — no rounding, bilinear sampling.", "Wrong — anchors belong to the RPN; RoIAlign has nothing to do with them.", "Wrong — that is R-CNN-style image cropping and warping, not RoIAlign."]}, {"id": "S10-Q4", "session": 10, "topic": "Mask R-CNN loss", "difficulty": "Medium", "question": "Mask R-CNN's mask branch outputs K masks of size 28×28 for each RoI (K = number of classes). Which loss trains it?", "options": ["A per-pixel softmax cross-entropy across the K masks.", "A Dice loss summed over all K masks.", "An L2 regression of all K masks to the ground-truth mask.", "A per-pixel sigmoid + binary cross-entropy on the mask of the RoI's ground-truth class only."], "answer": 3, "explanation": "Mask R-CNN uses per-pixel sigmoid and average binary cross-entropy on the ground-truth class's mask only, so masks of different classes do not compete (class-decoupled); the class comes from the box head.", "option_notes": ["Wrong — a softmax across classes couples mask and class prediction and performed much worse in the paper.", "Wrong — Mask R-CNN does not use a Dice loss and never trains all K masks.", "Wrong — masks are binary classification targets, not L2 regression targets.", "Correct — class-decoupled per-pixel BCE."]}, {"id": "S10-Q5", "session": 10, "topic": "Pixel accuracy pitfall", "difficulty": "Easy", "question": "In a medical dataset, 95% of pixels are background and 5% are tumour. A model predicts every pixel as background. Which statement is correct?", "options": ["Pixel accuracy is 0.95 and tumour IoU is also 0.95.", "Pixel accuracy is 0.95, tumour IoU is 0, and the two-class mIoU is 0.475.", "Pixel accuracy is 0.05, because the tumour is never detected.", "Pixel accuracy and mIoU are both 0.95, so the model is acceptable."], "answer": 1, "explanation": "All background pixels are correct, so pixel accuracy = 0.95; no tumour pixel is predicted, so tumour IoU = 0; background IoU = 0.95, so mIoU = (0.95 + 0)/2 = 0.475.", "option_notes": ["Wrong — tumour IoU is 0 because no tumour pixel is predicted.", "Correct — pixel accuracy hides the complete failure on the small class.", "Wrong — pixel accuracy counts all correctly labelled pixels, and 95% are correct.", "Wrong — mIoU is 0.475, and a model that never finds tumours is useless."]}, {"id": "S10-Q6", "session": 10, "topic": "Dice vs IoU", "difficulty": "Easy", "question": "A predicted mask has Dice = 0.80 with its ground truth. Its IoU is:", "options": ["0.667", "0.800", "0.889", "0.640"], "answer": 0, "explanation": "IoU = Dice / (2 − Dice) = 0.8 / 1.2 = 0.667 (check: 2 × 0.667 / 1.667 = 0.8).", "option_notes": ["Correct — IoU = Dice / (2 − Dice).", "Wrong — Dice and IoU are equal only at 0 and 1; Dice ≥ IoU.", "Wrong — that is 2 × 0.8 / 1.8, applying the IoU→Dice formula in the wrong direction.", "Wrong — that is 0.8²; there is no squared relation."]}, {"id": "S10-Q7", "session": 10, "topic": "Atrous convolution", "difficulty": "Medium", "question": "DeepLab uses a 3×3 atrous (dilated) convolution with dilation rate 4. Its effective kernel size and its number of weights per input–output channel pair are:", "options": ["12×12 and 144", "3×3 and 9, applied with stride 4", "9×9 and 9", "9×9 and 81"], "answer": 2, "explanation": "K_eff = D(K − 1) + 1 = 4 × 2 + 1 = 9, so the window is 9×9, but there are still only 9 weights: dilation spreads the taps without adding parameters or downsampling.", "option_notes": ["Wrong — 3 × 4 = 12 is the wrong formula, and the parameter count does not grow.", "Wrong — dilation is not stride; atrous convolution keeps resolution.", "Correct — 9×9 window, 9 weights.", "Wrong — only 9 taps carry weights; 81 would be a dense 9×9 kernel."]}, {"id": "S10-Q8", "session": 10, "topic": "Transposed convolution", "difficulty": "Medium", "question": "FCN-32s upsamples a 7×7 score map with a transposed convolution with kernel K = 64, stride S = 32, padding P = 16. The output size is:", "options": ["192×192", "256×256", "240×240", "224×224"], "answer": 3, "explanation": "Output = (W − 1)S − 2P + K = 6 × 32 − 32 + 64 = 224, back to the 224×224 input size.", "option_notes": ["Wrong — 192 = (7 − 1) × 32 only; forgets − 2P + K.", "Wrong — 256 forgets the padding term − 2P.", "Wrong — 240 subtracts the padding only once (− P instead of − 2P).", "Correct — (W − 1)S − 2P + K = 224."]}, {"id": "S11-Q1", "session": 11, "topic": "Intrinsic parameters", "difficulty": "Easy", "question": "How many degrees of freedom does a general intrinsic matrix K (including skew) have?", "options": ["4", "6", "5", "11"], "answer": 2, "explanation": "K has 5 free parameters: fₓ, f_y (focal lengths in pixels), skew s and the principal point (cₓ, c_y); its bottom row (0, 0, 1) is fixed.", "option_notes": ["Wrong — 4 is the count when skew is fixed to 0 (OpenCV's model), not the general K.", "Wrong — counts the 6 upper-triangular entries but forgets that K₃₃ = 1 is fixed.", "Correct — fₓ, f_y, s, cₓ, c_y.", "Wrong — 11 is the DOF of the full camera matrix P (5 intrinsic + 6 extrinsic)."]}, {"id": "S11-Q2", "session": 11, "topic": "Intrinsics vs extrinsics", "difficulty": "Easy", "question": "A calibrated camera is moved from one tripod position to another and rotated. Zoom and focus are unchanged. Which parameters must be re-estimated?", "options": ["The intrinsic matrix K only", "The rotation R and translation t only", "K, R and t", "The distortion coefficients and K"], "answer": 1, "explanation": "Moving/rotating the camera changes only its pose — the extrinsics R, t. Intrinsics and distortion belong to the lens and sensor, which are unchanged.", "option_notes": ["Wrong — backwards: K is exactly what does not change when the camera moves.", "Correct — only the pose (extrinsics) changes.", "Wrong — re-estimating K is unnecessary since zoom and focus are fixed.", "Wrong — distortion is intrinsic and does not depend on pose."]}, {"id": "S11-Q3", "session": 11, "topic": "Perspective projection", "difficulty": "Medium", "question": "Which property of the scene is preserved by ideal perspective (pinhole) projection?", "options": ["Parallelism of lines", "Ratios of lengths along a line (e.g. midpoints)", "Angles between lines", "Straight lines map to straight lines (ignoring lens distortion)"], "answer": 3, "explanation": "The plane through a 3D line and the camera centre cuts the image plane in a line, so lines map to lines; incidence and the cross-ratio are also preserved.", "option_notes": ["Wrong — parallel lines converge to a vanishing point (unless parallel to the image plane).", "Wrong — length ratios are not preserved; only the cross-ratio of 4 collinear points is.", "Wrong — angles are distorted by perspective foreshortening.", "Correct — collinearity is preserved by a pinhole camera."]}, {"id": "S11-Q4", "session": 11, "topic": "Lens distortion", "difficulty": "Medium", "question": "A wide-angle lens makes straight lines near the image border bow outward. In the model x_d = x(1 + k₁r² + k₂r⁴ + k₃r⁶), what is the most likely sign of k₁, and how do image points move relative to the ideal pinhole image?", "options": ["k₁ < 0; points are pulled towards the image centre", "k₁ > 0; points are pushed away from the image centre", "k₁ < 0; points are pushed away from the image centre", "k₁ > 0; points are pulled towards the image centre"], "answer": 0, "explanation": "Outward-bowing lines are barrel distortion: with k₁ < 0 the factor 1 + k₁r² is below 1 and shrinks with r, pulling points inward most strongly at the border.", "option_notes": ["Correct — barrel distortion: k₁ < 0, points pulled inward.", "Wrong — k₁ > 0 is pincushion (lines bow inward), typical of telephoto lenses.", "Wrong — the sign is right but a factor below 1 cannot push points outward.", "Wrong — inconsistent: k₁ > 0 makes the factor greater than 1, pushing points outward."]}, {"id": "S11-Q5", "session": 11, "topic": "Camera matrix DOF", "difficulty": "Medium", "question": "The 3×4 camera projection matrix P = K[R | t] has how many degrees of freedom?", "options": ["12", "6", "8", "11"], "answer": 3, "explanation": "P has 12 entries but is homogeneous (defined up to scale), so 12 − 1 = 11 DOF = 5 intrinsic + 6 extrinsic.", "option_notes": ["Wrong — forgets the overall scale ambiguity.", "Wrong — that is only the extrinsics (pose).", "Wrong — that is the DOF of a 3×3 homography.", "Correct — 12 entries minus 1 for scale."]}, {"id": "S11-Q6", "session": 11, "topic": "Homography revisited", "difficulty": "Medium", "question": "In which situation are two photographs related exactly by a single 3×3 homography?", "options": ["A camera translates 1 m sideways while viewing a cluttered room", "Two cameras with a 50 cm baseline view a 3D statue", "A camera rotates about its optical centre while viewing a cluttered room", "Any two images, once lens distortion has been removed"], "answer": 2, "explanation": "For pure rotation about the centre, x′ ~ K R K⁻¹ x, independent of depth, so it holds for any scene (the panorama case).", "option_notes": ["Wrong — translation with a non-planar scene causes parallax.", "Wrong — a baseline plus a 3D object is governed by F / E, not a homography.", "Correct — pure rotation gives H = K R K⁻¹ for every point.", "Wrong — removing distortion restores the pinhole model but does not remove parallax."]}, {"id": "S11-Q7", "session": 11, "topic": "Zhang calibration", "difficulty": "Hard", "question": "In Zhang's calibration with a planar checkerboard and no assumption on skew, why are at least three views needed?", "options": ["Each view's homography has 8 DOF, 6 of which are used by the board pose. That leaves 2 constraints per view on the 5 unknowns of B = K⁻ᵀK⁻¹.", "Each view gives one constraint, and K has 3 unknowns.", "Three views are needed to triangulate the board corners in 3D before calibrating.", "Each view gives 4 constraints, and the 12 entries of P need three views."], "answer": 0, "explanation": "Orthonormality of r₁, r₂ gives h₁ᵀBh₂ = 0 and h₁ᵀBh₁ = h₂ᵀBh₂: 2 equations per view on symmetric B (5 unknowns up to scale), so 2n ≥ 5 → n ≥ 3.", "option_notes": ["Correct — 2 constraints per view, 5 unknowns → 3 views.", "Wrong — each view gives 2 constraints and K has 5 unknowns.", "Wrong — the board is planar with known coordinates; no triangulation is involved.", "Wrong — confuses Zhang's method with DLT estimation of P."]}, {"id": "S11-Q8", "session": 11, "topic": "Vanishing points", "difficulty": "Hard", "question": "A camera has fₓ = f_y = 800 px and (cₓ, c_y) = (320, 240). A family of parallel 3D lines has direction D = (1, 0, 1) in camera coordinates. Where is their vanishing point in the image?", "options": ["(320, 240)", "(1120, 240)", "(885.7, 240)", "At infinity: parallel lines never meet in the image"], "answer": 1, "explanation": "v ~ K D = (800·1 + 320·1, 240·1, 1) = (1120, 240, 1), i.e. (1120, 240).", "option_notes": ["Wrong — that is the vanishing point of the optical-axis direction (0, 0, 1).", "Correct — v ~ K D.", "Wrong — uses f·Dₓ/‖D‖; the vanishing point depends on Dₓ/D_z = tan 45° = 1.", "Wrong — only lines parallel to the image plane (D_z = 0) vanish at infinity; here D_z = 1."]}, {"id": "S12-Q1", "session": 12, "topic": "Stereo disparity", "difficulty": "Easy", "question": "In a rectified stereo pair, point P has a larger disparity than point Q. What can you conclude?", "options": ["P is farther from the cameras than Q", "P and Q are at the same depth, because disparity depends only on the baseline", "P is nearer to the cameras than Q", "P lies closer to the epipole than Q"], "answer": 2, "explanation": "Z = fB/d, so depth is inversely proportional to disparity: a larger disparity means a nearer point.", "option_notes": ["Wrong — the classic inversion; far points have d → 0.", "Wrong — the baseline is the same for every point; disparity varies with depth.", "Correct — Z = fB/d, larger d means smaller Z.", "Wrong — in rectified stereo the epipoles are at infinity; disparity says nothing about distance to an epipole."]}, {"id": "S12-Q2", "session": 12, "topic": "Fundamental matrix", "difficulty": "Easy", "question": "How many degrees of freedom does the fundamental matrix F have?", "options": ["8", "7", "9", "5"], "answer": 1, "explanation": "F has 9 entries, minus 1 for scale and minus 1 for det F = 0 (rank 2), giving 7 DOF; this is why the 7-point algorithm is minimal.", "option_notes": ["Wrong — 8 is the number of points for the linear 8-point algorithm, not the DOF.", "Correct — 9 − 1 (scale) − 1 (det F = 0).", "Wrong — ignores both the scale and the rank constraint.", "Wrong — 5 is the DOF of the essential matrix."]}, {"id": "S12-Q3", "session": 12, "topic": "Essential matrix", "difficulty": "Medium", "question": "Why does the essential matrix E = [t]×R have 5 degrees of freedom rather than 6?", "options": ["R has 3 DOF and t has 3, but the overall scale of t cannot be recovered from image correspondences", "The rank-2 constraint removes one DOF from the 6 of R and t", "E has 9 entries minus the 4 parameters of K", "Only 5 point correspondences are ever available between two views"], "answer": 0, "explanation": "Scaling the scene and the baseline together leaves all images unchanged, so only the direction of t (2 DOF) is observable: 3 + 3 − 1 = 5.", "option_notes": ["Correct — the translation scale is unobservable.", "Wrong — [t]×R is automatically rank 2; that does not remove a DOF from (R, t).", "Wrong — E involves no K; it works on normalised coordinates.", "Wrong — confuses the 5-point minimal solver with the definition of DOF."]}, {"id": "S12-Q4", "session": 12, "topic": "Aperture problem", "difficulty": "Medium", "question": "Lucas–Kanade is applied to a window that contains a single straight vertical edge: intensity varies only along x, so I_y ≈ 0 everywhere in the window. What happens?", "options": ["Both u and v are recovered accurately", "Only the vertical component v (along the edge) can be recovered", "Neither component can be recovered, because I_t = 0 on edges", "Only the horizontal component u (normal to the edge) can be recovered, because AᵀA is nearly singular"], "answer": 3, "explanation": "With I_y ≈ 0, AᵀA ≈ diag(ΣIₓ², ≈0) has one near-zero eigenvalue: only the flow along the gradient (normal to the edge) is determined — the aperture problem.", "option_notes": ["Wrong — that needs two large eigenvalues (a corner or texture).", "Wrong — backwards: motion along the edge produces no brightness change.", "Wrong — I_t ≠ 0 when the edge moves horizontally, so the normal component is recoverable.", "Correct — the aperture problem: only normal flow is observable."]}, {"id": "S12-Q5", "session": 12, "topic": "Lucas–Kanade", "difficulty": "Medium", "question": "The 2×2 matrix AᵀA = [ΣIₓ², ΣIₓI_y; ΣIₓI_y, ΣI_y²] in Lucas–Kanade is the same as which matrix?", "options": ["The Hessian used in SIFT's edge-response test", "The Harris second-moment (structure) matrix M", "The fundamental matrix restricted to the window", "The covariance matrix of SORT's Kalman filter"], "answer": 1, "explanation": "Both are the gradient second-moment matrix; good Harris / Shi–Tomasi corners are exactly the windows where LK is well-conditioned.", "option_notes": ["Wrong — SIFT's edge test uses second derivatives (Dxx, Dyy, Dxy), not products of first derivatives.", "Correct — LK's normal matrix is the Harris structure tensor.", "Wrong — F is a 3×3 two-view geometric relation, unrelated to image gradients.", "Wrong — the Kalman covariance describes uncertainty of the box state."]}, {"id": "S12-Q6", "session": 12, "topic": "Structure from Motion", "difficulty": "Medium", "question": "Incremental SfM is run on photographs alone (calibrated cameras, no GPS, no known lengths). What can it recover?", "options": ["A metric 3D model and camera poses in metres", "Only the camera rotations, with no 3D structure", "Structure and poses up to an unknown similarity transform (global scale, rotation and translation)", "Structure only up to an arbitrary projective transformation, even though K is known"], "answer": 2, "explanation": "Scaling, rotating and translating the scene together with all cameras leaves every image unchanged, so monocular SfM is fixed only up to a 7-DOF similarity.", "option_notes": ["Wrong — metric units are not observable from images alone.", "Wrong — SfM recovers translations (up to scale) and triangulates 3D points.", "Correct — up to a similarity; metric scale needs a known length, GPS/IMU or a stereo baseline.", "Wrong — a projective ambiguity applies to uncalibrated cameras; with K known it reduces to a similarity."]}, {"id": "S12-Q7", "session": 12, "topic": "SLAM loop closure", "difficulty": "Medium", "question": "In a SLAM system, what does loop closure do that relocalisation does not?", "options": ["It detects a revisit of an already-mapped place during normal tracking and corrects the accumulated drift through pose-graph optimisation", "It recovers the camera pose after tracking has been lost, without modifying the map", "It initialises the map by triangulating points from the first two frames", "It selects which frames become keyframes for local bundle adjustment"], "answer": 0, "explanation": "Loop closure recognises a revisit (bag-of-words + geometric verification), adds a loop constraint and runs pose-graph optimisation to correct drift in the map and trajectory.", "option_notes": ["Correct — loop closure corrects accumulated drift.", "Wrong — that describes relocalisation (map unchanged).", "Wrong — that is map initialisation.", "Wrong — keyframe selection is a front-end / local-mapping decision."]}, {"id": "S12-Q8", "session": 12, "topic": "Stereo depth error", "difficulty": "Hard", "question": "A stereo rig has a depth uncertainty of 5 cm for objects at 5 m. With the same rig and the same disparity (matching) accuracy, what uncertainty do you expect at 15 m?", "options": ["15 cm", "5 cm", "135 cm", "45 cm"], "answer": 3, "explanation": "ΔZ ≈ Z²Δd/(fB) scales with Z²: tripling the distance gives 3² = 9× the error, i.e. 45 cm.", "option_notes": ["Wrong — assumes the error grows linearly with distance.", "Wrong — assumes a constant depth error; only the disparity error is constant.", "Wrong — assumes cubic growth (3³ = 27).", "Correct — quadratic growth: 9 × 5 cm."]}, {"id": "S13-Q1", "session": 13, "topic": "Foundation models", "difficulty": "Easy", "question": "Which statement best describes a foundation model?", "options": ["A model pre-trained on broad data at scale (mostly self- or weakly-supervised) that can be adapted to many downstream tasks", "Any model with more than one billion parameters", "A model trained on a single large labelled dataset to solve one task as well as possible", "A model that cannot be fine-tuned and can only be used through prompts"], "answer": 0, "explanation": "Foundation models are defined by broad, large-scale (usually self- or weakly-supervised) pre-training and by adaptability to many downstream tasks via zero-shot use, probes or fine-tuning.", "option_notes": ["Correct — broad pre-training plus adaptability is the definition.", "Wrong — parameter count alone does not make a foundation model.", "Wrong — that is the classic single-task supervised model the paradigm replaces.", "Wrong — foundation models are routinely fine-tuned (fully or parameter-efficiently) as well as prompted."]}, {"id": "S13-Q2", "session": 13, "topic": "CLIP", "difficulty": "Medium", "question": "What is CLIP's pre-training objective?", "options": ["Cross-entropy over the 1,000 ImageNet classes, followed by fine-tuning on captions", "Autoregressive generation of each image's caption, word by word", "A symmetric contrastive (InfoNCE) loss over the N × N image–text cosine-similarity matrix, with a learned temperature", "Mean-squared error between each image embedding and its caption embedding, with no negatives"], "answer": 2, "explanation": "CLIP builds the N × N cosine matrix between N images and N captions, scales it by a learned logit scale 1/τ, and applies cross-entropy along rows (image→text) and columns (text→image), averaging both.", "option_notes": ["Wrong — CLIP never trains on ImageNet labels; classification is done zero-shot afterwards.", "Wrong — caption generation was far less compute-efficient; CLIP only picks the right caption among N.", "Correct — symmetric InfoNCE over the N × N similarity matrix with a learned temperature.", "Wrong — without negatives such a loss could collapse; the other captions in the batch are CLIP's negatives."]}, {"id": "S13-Q3", "session": 13, "topic": "CLIP zero-shot", "difficulty": "Medium", "question": "In CLIP zero-shot classification, prompt ensembling means:", "options": ["averaging the image embeddings of several random crops of the test image", "averaging the normalised text embeddings of several prompt templates per class (then re-normalising) to form each class embedding", "training a separate linear classifier for each prompt template and taking a majority vote", "choosing, for each class, the single template that gives the highest accuracy on the test set"], "answer": 1, "explanation": "Several templates per class are encoded, their normalised text embeddings averaged and re-normalised into one class embedding; inference cost stays the same and accuracy improves by several points.", "option_notes": ["Wrong — that is image-side test-time augmentation, not prompt ensembling.", "Correct — average the template embeddings per class, then re-normalise.", "Wrong — no classifier is trained in zero-shot CLIP.", "Wrong — choosing templates on the test set is data leakage."]}, {"id": "S13-Q4", "session": 13, "topic": "DINO", "difficulty": "Medium", "question": "How does DINO avoid representation collapse?", "options": ["By contrasting each image against 65,536 negatives stored in a queue", "By using ImageNet labels as the teacher's targets", "By reconstructing masked pixels with a decoder", "By centering and sharpening the outputs of an EMA teacher (with stop-gradient)"], "answer": 3, "explanation": "DINO's teacher is an EMA of the student with stop-gradient; centering stops one output dimension from dominating and sharpening (low teacher temperature) stops the output from becoming uniform.", "option_notes": ["Wrong — that is MoCo's queue; DINO uses no negatives.", "Wrong — DINO is self-distillation with no labels.", "Wrong — that describes MAE; DINO matches output distributions between views.", "Correct — centering + sharpening of an EMA teacher prevent both collapse modes."]}, {"id": "S13-Q5", "session": 13, "topic": "SAM", "difficulty": "Medium", "question": "A user clicks once on a person's shirt and SAM returns three masks, each with a predicted IoU. Why?", "options": ["SAM returns one mask per predicted class, e.g. shirt, person and background", "The click is ambiguous (sub-part, part or whole object), so SAM returns several valid masks ranked by predicted IoU", "The three masks come from three image-pyramid scales of the image encoder", "They are the outputs of three decoder layers that are used only for deep supervision"], "answer": 1, "explanation": "A single point is ambiguous (pocket, shirt or whole person). SAM outputs three masks at different granularities and an IoU head predicts each one's quality so the best can be chosen.", "option_notes": ["Wrong — SAM masks are class-agnostic; it predicts no class labels.", "Correct — three granularities for an ambiguous prompt, ranked by predicted IoU.", "Wrong — SAM's encoder produces a single 64 × 64 embedding, not a pyramid of outputs.", "Wrong — the three masks are real inference outputs, not auxiliary deep-supervision heads."]}, {"id": "S13-Q6", "session": 13, "topic": "Depth Anything", "difficulty": "Easy", "question": "What does the (non-fine-tuned) Depth Anything model output for a single RGB image?", "options": ["A relative, affine-invariant inverse-depth map that must be scaled and shifted to obtain metres", "Metric depth in metres for any camera, without calibration", "A disparity map that requires a second, rectified image as input", "Surface normals and a semantic label for every pixel"], "answer": 0, "explanation": "Depth Anything is trained with an affine-invariant loss and outputs relative inverse depth (larger = closer), correct only up to an unknown scale and shift; metres need metric fine-tuning or alignment with known depths.", "option_notes": ["Correct — relative, affine-invariant inverse depth.", "Wrong — monocular depth has an inherent scale ambiguity; metric versions are separately fine-tuned.", "Wrong — it uses a single image; disparity from two rectified images is stereo.", "Wrong — it predicts depth only."]}, {"id": "S13-Q7", "session": 13, "topic": "OWL-ViT", "difficulty": "Medium", "question": "How does OWL-ViT detect a category it never saw labelled boxes for?", "options": ["It trains a new classification head with labelled boxes for every new category", "It segments everything with SAM and then classifies each mask with CLIP", "Each image token predicts a box and a class embedding, which is scored against the embeddings of the text (or example-image) queries", "It generates a caption for the image and searches the caption for the category name"], "answer": 2, "explanation": "OWL-ViT removes the pooling of a CLIP-style ViT; every output token predicts a box and a class embedding, scored by similarity with the query embedding (text prompt or example image), so the classifier weights are the queries themselves.", "option_notes": ["Wrong — no per-category training is needed for new categories.", "Wrong — that describes a SAM + CLIP pipeline, not OWL-ViT.", "Correct — per-token boxes and class embeddings matched to query embeddings.", "Wrong — OWL-ViT does not caption images."]}, {"id": "S13-Q8", "session": 13, "topic": "DINOv2", "difficulty": "Medium", "question": "Which statement correctly describes how DINOv2 differs from the original DINO?", "options": ["DINOv2 adds a text encoder so that it can classify images from text prompts", "DINOv2 is trained with ImageNet-22k labels instead of self-supervision", "DINOv2 replaces self-distillation with a pixel-reconstruction (MAE) loss only", "DINOv2 trains on a curated 142M-image dataset and adds a masked-patch (iBOT) objective and a KoLeo regulariser to the DINO loss"], "answer": 3, "explanation": "DINOv2 keeps self-distillation but scales it with the automatically curated LVD-142M dataset, adds the iBOT masked-patch loss for better dense features and the KoLeo regulariser for uniformly spread features.", "option_notes": ["Wrong — DINOv2 has no text encoder (a classic trap).", "Wrong — DINOv2 is still self-supervised, with no labels.", "Wrong — its masked objective predicts teacher patch tokens, combined with the DINO loss, not pixels.", "Correct — curated LVD-142M + iBOT masked patches + KoLeo."]}, {"id": "S14-Q1", "session": 14, "topic": "Grounding DINO", "difficulty": "Easy", "question": "In Grounding DINO, the word \"DINO\" refers to:", "options": ["the self-supervised self-distillation method whose features form the image backbone", "DINOv2, used as a frozen joint image–text encoder", "DETR with Improved deNoising anchOr boxes, a DETR-family object detector", "a distillation step that compresses Grounding DINO into a YOLO model"], "answer": 2, "explanation": "Grounding DINO is built on the DINO detector (DETR with Improved deNoising anchOr boxes), extended with a BERT text backbone and cross-modal fusion. It is unrelated to self-supervised DINO.", "option_notes": ["Wrong — the classic trap: self-supervised DINO is unrelated; the image backbone is a Swin Transformer.", "Wrong — DINOv2 has no text encoder and is not part of Grounding DINO.", "Correct — the DETR-family detector DINO.", "Wrong — \"DINO\" is not a distillation step; distilling into YOLO is something you may do with it."]}, {"id": "S14-Q2", "session": 14, "topic": "Zero-shot / open-vocabulary", "difficulty": "Easy", "question": "An open-vocabulary object detector is one that:", "options": ["can detect categories specified at inference time as free text, because it classifies regions by comparing them with text embeddings", "detects only the 80 COCO classes but with higher recall than a standard detector", "finds every object in the image but cannot name any of them", "requires retraining a classification head whenever a new category is added"], "answer": 0, "explanation": "Open-vocabulary detectors replace fixed per-class classifier weights with text embeddings of the names or phrases given at inference, so the category list can change without retraining.", "option_notes": ["Correct — text embeddings act as the classifier, so any named category can be queried.", "Wrong — a fixed 80-class detector is closed-set by definition.", "Wrong — that describes class-agnostic proposal or segmentation models such as SAM.", "Wrong — needing retraining for a new class is exactly the closed-set limitation."]}, {"id": "S14-Q3", "session": 14, "topic": "Grounding DINO thresholds", "difficulty": "Medium", "question": "In Grounding DINO's standard inference, what does box_threshold control?", "options": ["The IoU threshold used for NMS between overlapping boxes", "Which prompt tokens are attached to a kept box as its phrase label", "The minimum box area in pixels", "Which query predictions are kept, based on each query's highest similarity to any prompt token"], "answer": 3, "explanation": "Each query's score is its maximum sigmoid similarity over prompt tokens; the query is kept only if this exceeds box_threshold, so it trades precision against recall.", "option_notes": ["Wrong — the NMS IoU is a separate, optional post-processing parameter.", "Wrong — that is text_threshold, which builds the phrase for each kept box.", "Wrong — box_threshold has nothing to do with box area.", "Correct — it filters queries by their maximum token score."]}, {"id": "S14-Q4", "session": 14, "topic": "Grounded-SAM", "difficulty": "Medium", "question": "In a Grounded-SAM pipeline, what does SAM receive from Grounding DINO?", "options": ["Class labels that condition SAM's mask decoder on the category", "Bounding boxes, used as box prompts to produce one mask per detected object", "Text embeddings that replace SAM's image encoder", "Depth maps used to separate overlapping objects"], "answer": 1, "explanation": "Grounding DINO's boxes are converted to pixel coordinates and fed to SAM as box prompts; SAM returns one mask per box, and the label comes from Grounding DINO's phrase.", "option_notes": ["Wrong — SAM is class-agnostic and cannot be conditioned on class labels.", "Correct — boxes become SAM box prompts.", "Wrong — SAM's image encoder is still run once per image.", "Wrong — depth is a separate optional stage that consumes the masks."]}, {"id": "S14-Q5", "session": 14, "topic": "Depth in pipelines", "difficulty": "Medium", "question": "A Grounded-SAM + Depth Anything (standard relative-depth model) pipeline must report each dog's distance in metres. What else is required?", "options": ["Nothing — the Depth Anything output is already in metres", "A higher box_threshold, so that only confident dogs receive a depth", "A metric reference (a known-size object, calibrated depth points, or a metric fine-tuned depth model) to fix the scale and shift", "Running SAM with multi-mask output so that three depth values are available per dog"], "answer": 2, "explanation": "The standard Depth Anything output is relative, affine-invariant inverse depth. Metres need a metric fine-tuned model or calibration of 1/Z = s·r + t using references such as a known-size object (Z = fH/h_px), LiDAR or stereo points.", "option_notes": ["Wrong — the relative model has unknown scale and shift.", "Wrong — thresholds affect which dogs are detected, not the depth scale.", "Correct — a metric reference or metric model is needed.", "Wrong — multi-mask output changes mask granularity, not depth scale."]}, {"id": "S14-Q6", "session": 14, "topic": "Error propagation", "difficulty": "Medium", "question": "Grounding DINO misses a dog that is partly hidden behind a sofa. What happens to that dog in a Grounded-SAM pipeline?", "options": ["It is missed by the whole pipeline — SAM only segments what it is prompted with", "SAM segments it anyway, because SAM always segments every object in the image", "SAM detects it and labels it \"dog\" from its mask shape", "SAM re-scores the image and raises the detector's recall for that dog"], "answer": 0, "explanation": "In Grounded-SAM, SAM is prompted only by detected boxes, so a dog without a box never gets a mask or a distance: the detector caps the pipeline's recall (error propagation).", "option_notes": ["Correct — errors propagate; SAM cannot recover missed detections.", "Wrong — that is SAM's automatic mode, which Grounded-SAM does not use (and it would carry no label).", "Wrong — SAM never outputs class labels.", "Wrong — SAM has no mechanism to change the detector's scores."]}, {"id": "S14-Q7", "session": 14, "topic": "Grounding DINO architecture", "difficulty": "Medium", "question": "What does language-guided query selection do in Grounding DINO?", "options": ["It selects which words of the prompt are nouns and discards the rest", "It chooses the backbone size (Swin-T or Swin-L) according to the prompt length", "It removes duplicate boxes after decoding, like NMS", "It selects the image tokens most similar to the text features to initialise the decoder queries"], "answer": 3, "explanation": "After the feature enhancer, image tokens are scored by similarity to the text tokens; the top 900 initialise the decoder queries' anchor boxes, so decoding starts where the prompt is likely present.", "option_notes": ["Wrong — no part-of-speech filtering is performed.", "Wrong — the backbone is fixed by the chosen checkpoint.", "Wrong — de-duplication is handled by Hungarian training and optional NMS, not query selection.", "Correct — text-similar image tokens initialise the queries."]}, {"id": "S14-Q8", "session": 14, "topic": "Zero-shot vs fine-tuning", "difficulty": "Medium", "question": "A factory needs 60 FPS detection of 5 fixed part types on an edge device. It has 2,000 unlabelled images from its cameras and no annotations. What is the most appropriate approach?", "options": ["Run Grounding DINO + SAM on every frame on the edge device", "Auto-label the images with an open-vocabulary detector (e.g. Grounding DINO), review a sample by hand, and train a small closed-set real-time detector", "Use CLIP zero-shot classification on whole frames", "Use SAM automatic mask generation, which also outputs the part type of each mask"], "answer": 1, "explanation": "Fixed classes, a real-time edge constraint and no labels call for using the slow open-vocabulary model offline as a teacher, verifying a sample by hand, and distilling into a small closed-set detector that runs at 60 FPS.", "option_notes": ["Wrong — Grounding DINO + SAM runs at a few FPS on a server GPU, far below 60 FPS on edge hardware.", "Correct — auto-label, review, then distil into a fast closed-set detector.", "Wrong — whole-frame classification gives no boxes or per-part localisation.", "Wrong — SAM masks carry no part-type labels."]}, {"id": "S15-Q1", "session": 15, "topic": "Diffusion forward process", "difficulty": "Easy", "question": "In a DDPM, which statement about the forward (noising) process q(xₜ | xₜ₋₁) is correct?", "options": ["It is a learned encoder whose parameters are trained jointly with the denoiser, like a VAE encoder.", "It is a fixed Gaussian Markov chain defined by a pre-set variance schedule β₁, …, β_T; it has no learnable parameters.", "It is deterministic: xₜ is obtained from xₜ₋₁ by a fixed blur with no randomness.", "It must be simulated step by step from x₀ to xₜ during training because no closed form for q(xₜ | x₀) exists."], "answer": 1, "explanation": "The forward process q(xₜ | xₜ₋₁) = N(√(1 − βₜ) xₜ₋₁, βₜ I) is fixed by a hand-chosen schedule (e.g. linear 10⁻⁴ → 0.02, T = 1000). Only the reverse denoiser ε_θ is learned.", "option_notes": ["Wrong — that describes a VAE encoder; nothing in the diffusion forward process is trained.", "Correct — fixed Gaussian noising with a pre-set β schedule; no parameters.", "Wrong — each step adds random Gaussian noise, so it is stochastic, not a deterministic blur.", "Wrong — the closed form xₜ = √ᾱₜ x₀ + √(1 − ᾱₜ) ε exists, which is why training samples any t in one shot."]}, {"id": "S15-Q2", "session": 15, "topic": "VAE reparameterisation trick", "difficulty": "Medium", "question": "Why does a VAE write z = μ + σ ⊙ ε with ε ~ N(0, I) instead of sampling z ~ N(μ, diag σ²) directly?", "options": ["It makes the encoder deterministic, so no sampling is needed during training.", "It guarantees that the KL term becomes zero.", "It removes noise from z, which makes the decoder's outputs sharper.", "It moves the randomness into ε, which does not depend on the encoder's parameters, so z becomes a differentiable function of μ and σ and gradients can be back-propagated through the sampling step."], "answer": 3, "explanation": "Sampling from a distribution whose parameters depend on φ blocks back-propagation. With z = μ + σ ⊙ ε the randomness is in the parameter-free ε, and ∂z/∂μ = 1, ∂z/∂σ = ε, so the encoder can be trained by ordinary backprop.", "option_notes": ["Wrong — the model stays stochastic; the noise is only relocated into ε.", "Wrong — the KL depends on μ and σ, not on how z is sampled; it is zero only if μ = 0 and σ = 1.", "Wrong — the distribution of z is unchanged, so outputs are not sharpened (blur comes from the MSE likelihood).", "Correct — randomness moved to ε makes z differentiable with respect to μ and σ."]}, {"id": "S15-Q3", "session": 15, "topic": "GAN non-saturating loss", "difficulty": "Medium", "question": "Early in GAN training the discriminator easily rejects fakes, so D(G(z)) ≈ 0. Which generator objective is used in practice to avoid vanishing gradients?", "options": ["Maximise log D(G(z)) (equivalently, minimise −log D(G(z))).", "Minimise log D(G(z)).", "Minimise log(1 − D(G(z))), because its gradient is largest when D(G(z)) ≈ 0.", "Maximise log(1 − D(G(z)))."], "answer": 0, "explanation": "The non-saturating loss −log D(G(z)) has gradient −(1 − D) ≈ −1 with respect to the discriminator logit when D(G(z)) ≈ 0, giving a strong signal exactly when the generator is losing; it has the same fixed point as the minimax game.", "option_notes": ["Correct — the non-saturating generator loss.", "Wrong — wrong sign: minimising log D(G(z)) would make fakes more obviously fake.", "Wrong — this is the original saturating loss; its logit gradient is −D ≈ 0 when D(G(z)) ≈ 0, so it vanishes.", "Wrong — maximising log(1 − D(G(z))) helps the discriminator, the wrong direction for the generator."]}, {"id": "S15-Q4", "session": 15, "topic": "Classifier-free guidance", "difficulty": "Medium", "question": "Which statement about classifier-free guidance (CFG) is correct?", "options": ["It requires training a separate noise-aware image classifier whose gradient steers sampling.", "Guidance scale w = 0 gives the purely conditional prediction, and increasing w increases sample diversity.", "A single network is trained both with and without the condition (the condition is dropped, e.g. about 10% of the time), and at sampling time ε̂ = ε_θ(xₜ, ∅) + w (ε_θ(xₜ, c) − ε_θ(xₜ, ∅)).", "It needs only one U-Net evaluation per denoising step, so it is cheaper than unguided conditional sampling."], "answer": 2, "explanation": "CFG uses one model trained with condition dropout so it can predict both conditional and unconditional noise, then extrapolates between them with guidance scale w.", "option_notes": ["Wrong — that is classifier guidance; classifier-free guidance uses no classifier.", "Wrong — w = 0 is unconditional, w = 1 is plain conditional, and larger w reduces diversity.", "Correct — single network with condition dropout, combined predictions at sampling time.", "Wrong — CFG needs two evaluations per step (conditional and unconditional), so it roughly doubles the cost."]}, {"id": "S15-Q5", "session": 15, "topic": "Latent diffusion / Stable Diffusion", "difficulty": "Easy", "question": "When Stable Diffusion (v1) generates a 512×512 RGB image, what does its U-Net actually denoise?", "options": ["The 512×512×3 pixel image directly.", "A 64×64×4 latent produced by the VAE (downsampling factor f = 8).", "The 77×768 CLIP text embedding of the prompt.", "A single 4-dimensional latent vector per image."], "answer": 1, "explanation": "Latent diffusion runs in the VAE latent space: f = 8 and 4 channels map 512×512×3 to 64×64×4 (48× fewer values). The VAE decoder converts the final latent to pixels once at the end.", "option_notes": ["Wrong — that is pixel-space diffusion; latent diffusion never denoises pixels.", "Correct — the U-Net denoises a 64×64×4 VAE latent.", "Wrong — the text embedding is the condition (keys and values for cross-attention), not the denoised tensor.", "Wrong — the latent is a spatial 64×64×4 tensor, not a 4-dimensional vector."]}, {"id": "S15-Q6", "session": 15, "topic": "VAE blurriness", "difficulty": "Medium", "question": "A VAE with a Gaussian decoder (pixel-wise MSE reconstruction loss) produces blurry samples. What is the main reason?", "options": ["Under a factorised Gaussian likelihood (MSE), the best decoder output for an uncertain z is the average of all plausible images, which smears fine details.", "The KL term is computed with the wrong sign, which pushes latent codes away from the prior.", "The reparameterisation trick adds Gaussian noise directly to the decoder's output pixels.", "The decoder uses transposed convolutions, which cannot represent sharp edges."], "answer": 0, "explanation": "MSE is minimised by the conditional mean, so when fine details are uncertain the decoder outputs an average of plausible images, which looks blurry. The KL term only contributes indirectly by making posteriors overlap.", "option_notes": ["Correct — the Gaussian likelihood (MSE) averages over modes.", "Wrong — the KL term is correct as KL(q ‖ p); blaming the KL term is the classic trap.", "Wrong — the reparameterisation noise goes into z, not into output pixels, and does not change the modelled distribution.", "Wrong — GANs use the same transposed-conv decoders and produce sharp images."]}, {"id": "S15-Q7", "session": 15, "topic": "CycleGAN vs pix2pix", "difficulty": "Easy", "question": "You want to translate summer photos into winter photos, but you have no pixel-aligned (summer, winter) pairs of the same scenes. Which method fits best, and why?", "options": ["pix2pix, because its L1 loss can be computed between unpaired images.", "DCGAN, because transposed convolutions translate one image style into another.", "A plain autoencoder trained on summer photos, because its decoder outputs winter images.", "CycleGAN, because the cycle-consistency losses (F(G(x)) ≈ x and G(F(y)) ≈ y) constrain the mapping without paired examples."], "answer": 3, "explanation": "CycleGAN learns two mappings between unpaired domains, using adversarial losses plus cycle-consistency L1 losses so that translating there and back recovers the input.", "option_notes": ["Wrong — pix2pix's L1 term compares the output with a paired ground-truth image, so it needs aligned pairs.", "Wrong — DCGAN is an unconditional generator from noise; it does not translate a given image.", "Wrong — an autoencoder trained on summer photos only reconstructs summer photos.", "Correct — cycle-consistency makes unpaired translation possible."]}, {"id": "S15-Q8", "session": 15, "topic": "ControlNet zero convolutions", "difficulty": "Hard", "question": "ControlNet attaches a trainable copy of the Stable Diffusion U-Net encoder to the frozen (locked) U-Net through zero convolutions (1×1 convolutions whose weights and biases are initialised to 0). What is their main purpose?", "options": ["They keep the gradient with respect to their own weights permanently zero, so the locked model can never change.", "They downsample the 512×512 condition image to the 64×64 latent resolution.", "At initialisation they output exactly zero, so the combined model reproduces the original Stable Diffusion exactly and no random noise disturbs the pretrained features; their weights then grow from zero during training.", "They replace the cross-attention layers so that a text prompt is no longer needed."], "answer": 2, "explanation": "Zero-initialised 1×1 convs add nothing at the start, so training begins from exactly the original model; because the gradient with respect to their weights equals their non-zero input features, they gradually learn to inject the control signal.", "option_notes": ["Wrong — only the output is zero at the start; the weight gradient equals the input features, which are non-zero, so they learn. The original model is locked by freezing it.", "Wrong — a small separate conv encoder downsamples the condition image; 1×1 convs do not change resolution.", "Correct — zero output at initialisation preserves the pretrained model while the control branch is learned.", "Wrong — text still enters via cross-attention; ControlNet adds spatial control on top of it."]}];
const SESSIONS = {"1": "Image Processing & Features", "2": "Feature Matching & Classical CV", "3": "CNNs Under the Hood", "4": "Training & Transfer Learning", "5": "Embeddings & Similarity", "6": "Detection I: Two-Stage", "7": "Detection II: One-Stage", "8": "Detection III: Transformers", "9": "Revision & Practicals", "10": "Segmentation", "11": "Camera Geometry", "12": "3D Vision & Motion", "13": "Foundation Models", "14": "Vision++ Pipelines", "15": "Generative CV"};
const KEY = "cv-exam-quiz-v1";
const $ = (id) => document.getElementById(id);

let store = { answers: {}, sessions: [], diff: "", status: "", shopt: false };
try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

let order = QUESTIONS.map((_, i) => i);   // global question order (shuffle reorders this)
let pool = [], idx = 0, perms = {};

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function permFor(q) {
  if (!store.shopt) return [0, 1, 2, 3];
  if (!perms[q.id]) perms[q.id] = shuffle([0, 1, 2, 3]);
  return perms[q.id];
}

function buildChips() {
  const box = $("chips"); box.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip"; all.textContent = "All";
  all.setAttribute("aria-pressed", store.sessions.length === 0);
  all.onclick = () => { store.sessions = []; refresh(true); };
  box.appendChild(all);
  Object.keys(SESSIONS).map(Number).sort((a, b) => a - b).forEach((s) => {
    const n = QUESTIONS.filter((q) => q.session === s).length;
    if (!n) return;
    const c = document.createElement("button");
    c.className = "chip"; c.title = SESSIONS[s];
    c.textContent = `S${String(s).padStart(2, "0")} ${SESSIONS[s]} (${n})`;
    c.setAttribute("aria-pressed", store.sessions.includes(s));
    c.onclick = () => {
      store.sessions = store.sessions.includes(s) ? store.sessions.filter((x) => x !== s) : [...store.sessions, s];
      refresh(true);
    };
    box.appendChild(c);
  });
}

function refresh(resetIdx) {
  const curId = pool[idx] !== undefined ? QUESTIONS[pool[idx]].id : null;
  pool = order.filter((i) => {
    const q = QUESTIONS[i], a = store.answers[q.id];
    if (store.sessions.length && !store.sessions.includes(q.session)) return false;
    if (store.diff && q.difficulty !== store.diff) return false;
    if (store.status === "unanswered" && a !== undefined) return false;
    if (store.status === "wrong" && (a === undefined || a === q.answer)) return false;
    return true;
  });
  if (resetIdx) idx = 0;
  else { const k = pool.findIndex((i) => QUESTIONS[i].id === curId); idx = k >= 0 ? k : Math.min(idx, Math.max(pool.length - 1, 0)); }
  save(); buildChips(); render();
}

function render() {
  $("diff").value = store.diff; $("status").value = store.status; $("shopt").checked = store.shopt;
  const card = $("card");
  card.innerHTML = "";
  if (!pool.length) {
    card.innerHTML = '<div class="empty">No questions match these filters.</div>';
    $("pos").textContent = "0 / 0"; $("barfill").style.width = "0";
  } else {
    const q = QUESTIONS[pool[idx]], chosen = store.answers[q.id], answered = chosen !== undefined;
    $("pos").textContent = `Question ${idx + 1} / ${pool.length}`;
    $("barfill").style.width = `${((idx + 1) / pool.length) * 100}%`;
    const meta = document.createElement("div"); meta.className = "meta";
    [[`Session ${q.session} · ${SESSIONS[q.session] || ""}`, ""], [q.topic || "", ""], [q.difficulty, q.difficulty], [q.id, ""]]
      .filter(([t]) => t).forEach(([t, cls]) => { const s = document.createElement("span"); s.className = `tag ${cls}`; s.textContent = t; meta.appendChild(s); });
    const qt = document.createElement("div"); qt.className = "q"; qt.textContent = q.question;
    const opts = document.createElement("div"); opts.className = "opts";
    permFor(q).forEach((oi, pos) => {
      const b = document.createElement("button"); b.className = "opt"; b.disabled = answered;
      const k = document.createElement("span"); k.className = "k"; k.textContent = "ABCD"[pos];
      const body = document.createElement("span"); body.textContent = q.options[oi];
      if (answered) {
        if (oi === q.answer) b.classList.add("correct");
        else if (oi === chosen) b.classList.add("wrong");
        if (q.option_notes && q.option_notes[oi]) { const n = document.createElement("span"); n.className = "note"; n.textContent = q.option_notes[oi]; body.appendChild(n); }
      }
      b.append(k, body);
      b.onclick = () => answer(q, oi);
      opts.appendChild(b);
    });
    const fb = document.createElement("div");
    if (answered) {
      const ok = chosen === q.answer;
      fb.className = `fb show ${ok ? "ok" : "bad"}`;
      const h = document.createElement("b"); h.textContent = ok ? "✓ Correct" : `✗ Not quite. The answer is ${"ABCD"[permFor(q).indexOf(q.answer)]}.`;
      const e = document.createElement("div"); e.textContent = q.explanation;
      fb.append(h, e);
    } else fb.className = "fb";
    card.append(meta, qt, opts, fb);
  }
  $("prev").disabled = idx <= 0; $("next").disabled = idx >= pool.length - 1;
  renderDots(); renderScore();
}

function renderDots() {
  const box = $("dots"); box.innerHTML = "";
  if (pool.length > 150) return;
  pool.forEach((qi, k) => {
    const q = QUESTIONS[qi], a = store.answers[q.id];
    const d = document.createElement("button");
    d.className = "dot" + (a === undefined ? "" : a === q.answer ? " ok" : " bad") + (k === idx ? " cur" : "");
    d.textContent = k + 1; d.title = `${q.id} · ${q.topic || ""}`;
    d.onclick = () => { idx = k; render(); };
    box.appendChild(d);
  });
}

function renderScore() {
  const inPool = pool.map((i) => QUESTIONS[i]);
  const done = inPool.filter((q) => store.answers[q.id] !== undefined);
  const right = done.filter((q) => store.answers[q.id] === q.answer).length;
  $("sc").textContent = `${right} / ${done.length}`;
  $("acc").textContent = done.length ? `${Math.round((100 * right) / done.length)}%` : "—";
  $("ans").textContent = `${done.length} / ${inPool.length}`;
  const tb = $("bysess"); tb.innerHTML = "";
  Object.keys(SESSIONS).map(Number).sort((a, b) => a - b).forEach((s) => {
    const qs = QUESTIONS.filter((q) => q.session === s); if (!qs.length) return;
    const d = qs.filter((q) => store.answers[q.id] !== undefined), r = d.filter((q) => store.answers[q.id] === q.answer).length;
    const tr = document.createElement("tr");
    [`S${String(s).padStart(2, "0")} ${SESSIONS[s]}`, `${d.length} / ${qs.length}`, r, d.length ? `${Math.round((100 * r) / d.length)}%` : "—"]
      .forEach((v, i) => { const td = document.createElement("td"); td.textContent = v; if (i) td.className = "n"; tr.appendChild(td); });
    tb.appendChild(tr);
  });
}

function answer(q, oi) {
  if (store.answers[q.id] !== undefined) return;
  store.answers[q.id] = oi; save(); render();
}

$("total").textContent = QUESTIONS.length;
$("prev").onclick = () => { if (idx > 0) { idx--; render(); } };
$("next").onclick = () => { if (idx < pool.length - 1) { idx++; render(); } };
$("diff").onchange = (e) => { store.diff = e.target.value; refresh(true); };
$("status").onchange = (e) => { store.status = e.target.value; refresh(true); };
$("shopt").onchange = (e) => { store.shopt = e.target.checked; perms = {}; refresh(false); };
$("shuffle").onclick = () => { shuffle(order); refresh(true); };
$("order").onclick = () => { order = QUESTIONS.map((_, i) => i); refresh(true); };
$("reset").onclick = () => { if (confirm("Clear all your answers?")) { store.answers = {}; perms = {}; refresh(true); } };
$("theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") $("next").click();
  else if (e.key === "ArrowLeft") $("prev").click();
  else {
    const k = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
    if (k >= 0 && pool.length) { const q = QUESTIONS[pool[idx]]; answer(q, permFor(q)[k]); }
  }
});
refresh(true);
</script>
</body>
</html>
