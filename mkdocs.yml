  - Notes:
      - "01 · Image Processing & Features": notes/01_image_processing_features.md
      - "02 · Feature Matching & Classical CV": notes/02_feature_matching_classical.md
      - "03 · CNNs Under the Hood": notes/03_cnns_under_the_hood.md
      - "04 · Training CNNs & Transfer Learning": notes/04_training_transfer_learning.md
      - "05 · Embeddings & Image Similarity": notes/05_embeddings_similarity.md
      - "06 · Detection I: Two-Stage": notes/06_detection_two_stage.md
