site_name: "Computer Vision: Exam Prep"
site_description: "Notes, practice questions with full solutions, mock exams, a numericals drill and a quiz for a 16-session Computer Vision course."
site_url: https://imajij.github.io/cv-exam-prep/
repo_url: https://github.com/imajij/cv-exam-prep
repo_name: imajij/cv-exam-prep
docs_dir: docs  # assembled by scripts/prepare_docs.sh from the repo layout

theme:
  name: material
  features: [navigation.tabs, navigation.sections, navigation.top, navigation.footer, navigation.indexes, toc.follow, search.highlight, search.suggest, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}  # GitHub-style anchors
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Quiz: https://imajij.github.io/cv-exam-prep/quiz.html
  - Quick reference:
      - Formula sheet: 00_formula_sheet.md
